# Dependabot keeps the dependency trees current. Weekly cadence to keep PR
# volume manageable; review and merge the bumps as they land.
#
# Both ecosystems are covered. npm was added 2026-08-16 — before that the
# frontend's 406-package transitive tree received no automated vulnerability or
# update PRs at all, which was the largest gap in the supply-chain posture
# despite npm being the more actively attacked registry.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/wikantik-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The dev toolchain churns fast and ships nothing to production; group it
      # so a week of patch bumps is one reviewable PR rather than a dozen.
      dev-toolchain:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # HELD DELIBERATELY — see docs/developer/dependency-upgrade-log.md (2026-08-16).
      # rehype-katex (latest, 7.0.1) hard-depends on katex ^0.16.0. Taking katex
      # 0.17+ resolves two katex copies into the bundle and splits math rendering
      # between the editor preview and the reader. Revisit when rehype-katex
      # widens its range; security patches within 0.16.x still come through.
      - dependency-name: "katex"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # HELD — see docs/developer/dependency-upgrade-log.md (2026-10-12). 6.43.14's
      # DOMObserver.flush calls view.update([]) on any selection change; happy-dom
      # dispatches selectionchange synchronously from Selection.collapse (browsers
      # queue it), so the update re-enters itself and PageEditor.realCodeMirror.test
      # fails. 6.43.15 (tried 2026-11-14) still does that under happy-dom and, in a real
      # browser, intermittently lands ArrowDown from a wrapped line one character short of
      # the next line (LivePreviewKeyboardIT.arrowDownOnAWrappedLineAboveATableEntersItOnly-
      # FromTheLastVisualRow failed 2 of 3 collab runs; 0 of 3 on 6.43.13). Pinned exactly
      # at 6.43.13 in package.json; 6.43.16+ still surfaces for review.
      - dependency-name: "@codemirror/view"
        versions: ["6.43.14", "6.43.15"]
