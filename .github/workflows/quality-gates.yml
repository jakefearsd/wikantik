name: Quality Gates

# Restores gate enforcement after the self-hosted runner went dark (~2026-05-16):
# the fast static gates run on GitHub-hosted runners for every push to main, so
# a red complexity ratchet or broken build can no longer land silently.
# The full unit suite is heavier (~5k tests) and runs weekly + on demand to
# conserve Actions minutes; the full IT reactor stays a local pre-commit gate
# (Cargo/Postgres/pgvector — not runnable on hosted runners).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC — weekly full unit suite

jobs:
  static-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wikantik-frontend/package-lock.json

      # Full reactor build without running tests (still compiles test sources
      # via the test-jar modules and runs the Apache RAT license check).
      - name: Build (skip tests) + RAT
        run: mvn -B -T 1C clean install -DskipTests

      # CI complexity ratchet: fails on any NEW complexity violation (PMD
      # design rules) not already carved out in
      # build-support/pmd-complexity-baseline.properties. Burn down debt by
      # shrinking/decomposing a class until it clears its rule(s), then delete
      # that rule (or the whole line) from the baseline. Adding a NEW baseline
      # line requires justification in the commit message.
      #
      # -fn, not -fae: -fae skips every module downstream of the first failing one,
      # which hid a second new violation in September 2026. -fn checks every module but
      # always exits 0, so the step passes only if the reactor printed BUILD SUCCESS
      # (a crash that never reaches the summary fails too).
      - name: Complexity ratchet
        run: |
          mvn -B -fn pmd:check -Pcomplexity-gate | tee pmd-gate.log
          if ! grep -q 'BUILD SUCCESS' pmd-gate.log; then
            echo '::error::Complexity ratchet failed. New violations across all modules:'
            grep 'PMD Failure' pmd-gate.log || true
            exit 1
          fi

      - name: Frontend lint (ESLint)
        working-directory: wikantik-frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run lint

      # Supply-chain gates. These run on every push to main, which is the path
      # this repo actually uses — dependency-review.yml only fires on pull
      # requests, so it covers Dependabot's PRs but never a direct push.
      - name: Frontend supply-chain — registry signatures & provenance
        working-directory: wikantik-frontend
        # Verifies every installed tarball against the registry's signing key,
        # catching a tampered or substituted package that a version check alone
        # would pass. Baseline 2026-08-16: 382/382 signed, 91 attested.
        run: npm audit signatures

      - name: Frontend supply-chain — known vulnerabilities
        working-directory: wikantik-frontend
        # audit-level=high comes from wikantik-frontend/.npmrc. Moderate findings
        # in the dev toolchain are reported but non-blocking: nothing in
        # devDependencies reaches the shipped bundle.
        run: npm audit

      - name: Frontend supply-chain — lockfile must be authoritative
        working-directory: wikantik-frontend
        # `npm ci` above already fails on package.json/lock drift. This asserts
        # the stronger property that no install rewrote the lockfile, so the
        # tree CI verified is byte-identical to the one the WAR build installs.
        run: git diff --exit-code -- package-lock.json

      # `test:coverage` also enforces the vitest coverage thresholds in
      # vite.config.js (a floor per metric that only ratchets up).
      - name: Frontend unit tests + coverage ratchet (vitest)
        working-directory: wikantik-frontend
        run: npm run test:coverage

  shell-tests:
    # Deploy/ops tooling suites under bin/tests/. These guard bin/remote.sh,
    # bin/container.sh and the DB helper scripts — none of which the Maven
    # reactor covers, so before this job they only ran when someone remembered
    # to run them by hand. Dry-run + stub style: no real ssh, no real Postgres.
    # `docker compose config` is the only external need (preinstalled on
    # ubuntu-latest); the suites never start a container.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The compose files declare `env_file: .env`, which is gitignored — without
      # it `docker compose config` fails outright ("env file .env not found"),
      # so the suites only ever passed on a machine that already had a local
      # .env. The tracked template is enough: these tests only parse compose,
      # they never start anything.
      - name: Seed .env from the tracked template
        run: cp .env.example .env

      - name: Deploy + ops tooling tests
        # Globbed, not a hardcoded list: the list silently went stale every time
        # a suite was added (test-docker-cleanup.sh was written and never ran
        # here), which is the exact failure mode this job exists to prevent.
        # `sort` keeps the order deterministic across runners.
        run: |
          set -e
          for suite in $(ls bin/tests/test-*.sh | sort); do
            echo "::group::$(basename "${suite}")"
            bash "${suite}"
            echo "::endgroup::"
          done

  osv-scan:
    # Dependency vulnerability scan: Maven tree via a CycloneDX SBOM (Maven has
    # no lockfile) + the frontend npm lockfile, checked against OSV.dev.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The step name claimed "all scopes" but the goal defaults to
      # includeTestScope=false, so mockito/testcontainers/h2/archunit and the rest
      # of the test tree were never scanned — a blind spot in the one job that
      # exists to catch vulnerable dependencies. Test-scope code still runs on
      # developer machines and on this runner, so it is worth seeing. Verified
      # 2026-08-19: the test-scope BOM is 423 components and OSV-clean, so turning
      # this on does not make the gate red today.
      - name: Generate CycloneDX SBOM (aggregate, all scopes incl. test)
        run: mvn -B -q -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DincludeTestScope=true

      - name: Install OSV-Scanner
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan Maven SBOM + npm lockfile
        run: |
          osv-scanner scan source \
            --config osv-scanner.toml \
            -L target/bom.json \
            -L wikantik-frontend/package-lock.json

  unit-tests:
    # Weekly + manual only — the ~5k-test suite is too heavy for per-push
    # hosted minutes. Sequential on purpose: parallel surefire is flaky here.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wikantik-frontend/package-lock.json

      # -Pcoverage also runs the per-module JaCoCo line-coverage ratchet
      # (coverage-check in the root pom): a module that drops below its pinned
      # <wikantik.coverage.line.minimum> fails this job.
      - name: Full unit suite + coverage ratchet
        run: mvn -B clean install -DskipITs -Dtests.requireDocker=true -Pcoverage

  report-failures:
    # A red gate must reach the owner's inbox, not sit in the Actions tab: the static
    # gate stayed red for four days in September 2026 before anyone noticed. This opens
    # one issue per failing job (repo watchers get the email), comments on it while the
    # job stays red, and closes it the next time that job passes. A job skipped by this
    # event (unit-tests on push, the static gates on the weekly schedule) leaves its issue
    # untouched, so a green weekly run can never close a push-gate failure.
    needs: [ static-gates, shell-tests, osv-scan, unit-tests ]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close one issue per gate job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for job in $(jq -r 'keys[]' <<<"${NEEDS}"); do
            result=$(jq -r --arg j "${job}" '.[$j].result' <<<"${NEEDS}")
            title="Quality Gates: ${job} failing on main"
            existing=$(gh issue list --state open --limit 100 --json number,title \
                         --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
            case "${result}" in
              failure|cancelled)
                body=$(printf '`%s` finished **%s** on `%s` at %s.\n\nRun: %s' \
                         "${job}" "${result}" "${EVENT}" "${SHA}" "${RUN_URL}")
                if [ -n "${existing}" ]; then
                  gh issue comment "${existing}" --body "${body}"
                else
                  gh issue create --title "${title}" --body "${body}"
                fi
                ;;
              success)
                if [ -n "${existing}" ]; then
                  gh issue close "${existing}" --comment "Green again at ${SHA}: ${RUN_URL}"
                fi
                ;;
              *)
                echo "${job}: ${result} (not run by this event), issue left as-is"
                ;;
            esac
          done
