# Editorial layout for the generated docs/wikantik-pages/Main.md.
#
# Edit this file (not Main.md) to change what appears on the wiki front page.
# After editing, run:
#
#   java -cp wikantik-extract-cli/target/wikantik-extract-cli.jar \
#        com.wikantik.extractcli.GenerateMainPageCli docs/wikantik-pages --write
#
# CI runs the same command in --check mode and fails the build if Main.md
# diverges from what this file would produce.
#
# Page references are by canonical_id (the ULID in each page's frontmatter)
# rather than slug, so renames don't break Main.md. Override title or
# summary per-page when the frontmatter lacks one or the editorial voice
# differs from the page's own self-description.

# The front page's <title>, its <h1> and its search-result description (keep the summary at 50-160 characters).
title: 'Wikantik: Agent-Grade Technical Knowledge Wiki'
summary: 'A technical knowledge wiki for human reading and AI agent retrieval: {{wiki:articles|round=100}} articles on software, AI, math and engineering, with MCP tools.'

intro: |-
  **Wikantik is a technical wiki written to be read by people and queried by AI agents.** It holds {{wiki:articles|round=100}} articles on software, AI, mathematics and engineering. Articles are grouped into {{wiki:clusters}} topic clusters, and each cluster starts from a hub page that maps it.

  ### Three ways in

  - **Read.** Pick a subject from the list below, search from the sidebar, or open the Page Graph there to see how pages link to each other.
  - **Connect an agent.** The wiki serves its content over MCP: an agent can search it, pull cited passages for a question, and start a session with its project's context already assembled. The [Agent Cookbook](AgentCookbook) has the recipes, and [Hybrid Retrieval](HybridRetrieval) explains how search works.
  - **See how it is built.** [About](About) gives the reasoning behind the platform, the [Wikantik Platform Hub](WikantikPlatformHub) covers its internals, and the [Simple Agility Stack Hub](SimpleAgilityStackHub) shows how it is used to coordinate work across several software projects. News and longer pieces are on the [Wikantik blog](https://blog.wikantik.com/wikantik/).
