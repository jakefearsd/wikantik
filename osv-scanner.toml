# OSV-Scanner configuration for the `osv-scan` quality gate
# (.github/workflows/quality-gates.yml).
#
# Entries here suppress a specific advisory for a stated reason. They are NOT a
# way to make the gate quiet: every entry must name why the finding cannot apply
# to this codebase, and carry a review date so it cannot rot silently. If the
# reason stops holding (we start using the affected API, or an upgrade path
# appears), delete the entry and fix the dependency instead.

# No active suppressions.
#
# The react-router GHSA-qwww-vcr4-c8h2 entry was removed on 2026-08-19: its
# stated reason ("no upgrade path — the only fixed version is 8.3.0, and
# react-router-dom's latest is 7.18.1") went stale when upstream backported the
# fix to the 7.x line. OSV now carries two ranges, [7.12.0 -> 7.18.2] and
# [8.0.0 -> 8.3.0], and this app is on 7.18.2 in both react-router and
# react-router-dom, so the advisory no longer matches and osv-scanner reported
# the entry as an UNUSED ignore. Per the policy above, a suppression whose
# reason stops holding is deleted rather than left to rot.
