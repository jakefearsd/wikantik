# [REST API, MCP & agent surfaces]
# MCP server identity
# Type: string
mcp.server.name = wikantik-mcp
# Human-readable title shown to MCP clients.
# Type: string
mcp.server.title = Wikantik Knowledge Base
# Server version string advertised to MCP clients in the initialize handshake.
# This is the MCP server-surface version and is deliberately decoupled from the
# product release in pom.xml - it is not bumped when Wikantik is. Change it only
# when the advertised MCP surface itself changes in a way clients should notice.
# Type: string
mcp.server.version = 2.0.0

# Instructions text served by the MCP server.
# By default the bundled /wikantik-mcp-instructions.txt classpath resource is
# served. To override with a filesystem file (e.g. an operator-edited copy
# outside the WAR), set this to an ABSOLUTE path, e.g.
# /opt/wikantik/wikantik-mcp-instructions.txt. Relative paths are NOT
# supported - the code resolves them against the JVM working dir, which is
# rarely useful, and quietly falls back to the bundled resource instead. An
# unreadable configured file also falls back to the bundled resource.
# Type: path
# Blank means: the bundled classpath instructions resource is served
mcp.instructions.file =

# [MCP access]
# Access control - a request passes if it matches EITHER a DB-minted API key
# OR a source IP within one of these comma-separated CIDR blocks. Generate
# DB-backed keys via the admin UI at /admin/apikeys (scope=mcp or scope=all).
# Those keys are bound to a Wikantik principal so JAAS/ACLs apply to each call
# exactly as they would for that user's interactive session.
# Type: list
# Blank means: no CIDR allowlist; only API keys (or allowUnrestricted) grant access
mcp.access.allowedCidrs =

# *** SECURITY ***
# When neither a DB-minted API key nor mcp.access.allowedCidrs grants a
# request, the filter fails closed: every MCP request is rejected with HTTP
# 503 and a CRITICAL line is logged at startup. Setting this to true disables
# both checks (for a trusted local deployment) and treats every MCP caller as
# a superuser. The integration test suite sets this to true; production
# deployments must leave it false.
# Type: boolean
mcp.access.allowUnrestricted = false

# [MCP limits]
# Rate limiting (requests per second, 0 = disabled). NOTE: the deployment
# templates deliberately override this. The bare-metal template
# (wikantik-war/src/main/config/tomcat/wikantik-mcp.properties.template) sets
# 300, and the container sets MCP_RATE_LIMIT_GLOBAL, default 500
# (docker/entrypoint.sh, .env.example) - so 500 is what a stock Docker
# deployment actually runs. This file's value applies only when neither
# override is present.
# Type: int
mcp.ratelimit.global = 100
# Per-client rate limit, requests per second, 0 = disabled. Overridden the same
# way as mcp.ratelimit.global above: bare-metal template 100, container
# MCP_RATE_LIMIT_PER_CLIENT default 50.
# Type: int
mcp.ratelimit.perClient = 10
# Maximum number of distinct clients tracked by the per-client rate limiter's
# sliding-window state. Raise it only if legitimate distinct callers
# regularly exceed this count; excess entries are simply not rate-limited.
# Type: int
wikantik.mcp.rate_limit.max_clients = 10000
# Maximum number of KG-curation proposals that may be acted on in a single
# bulk curation call (e.g. bulk-approve/bulk-reject).
# Type: int
wikantik.mcp.kg_curation.bulk_limit = 50
