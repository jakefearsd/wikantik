<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikantik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Attach the webfont stylesheet only AFTER the window load event.
      //
      // As a plain <link> - and also as media="print", and as rel="preload" - it is a
      // load-blocking resource, so a network that BLACKHOLES the Google font hosts
      // (privacy blocklists commonly do, and they drop packets rather than refusing the
      // connection) left every page stuck at document.readyState "interactive" until
      // Chrome gave up, ~80s. Text was readable throughout - display=swap renders the
      // fallback stack immediately - but the page never signalled that it had loaded,
      // which stalls anything waiting on it, browser automation included.
      //
      // Injecting after load makes the fonts strictly additive: reachable CDN swaps them
      // in a moment later, unreachable CDN costs the page nothing at all.
      addEventListener("load", function () {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap";
        document.head.appendChild(l);
      });
    </script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" /></noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Inline fallback styles — must not depend on external CSS */
      #loading-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #6B6560;
      }
      #loading-fallback h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2rem;
        color: #2D2D2D;
        margin: 0 0 1.5rem 0;
      }
      #loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #E8E4DC;
        border-top-color: #7A8B6F;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-fallback p { margin: 1rem 0 0; font-size: 0.95rem; }
      #loading-error {
        opacity: 0;
        visibility: hidden;
        animation: fadeInError 0.5s ease-in 10s forwards;
        text-align: center;
        margin-top: 2rem;
        padding: 1.5rem;
        background: #FFF5F5;
        border: 1px solid #E8CECE;
        border-radius: 8px;
        max-width: 420px;
      }
      @keyframes fadeInError { to { opacity: 1; visibility: visible; } }
      #loading-error p { margin: 0.5rem 0; color: #6B6560; }
      #loading-error a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.5rem 1.25rem;
        background: #7A8B6F;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-size: 0.9rem;
      }
      #loading-error a:hover { background: #66785C; }
    </style>
  </head>
  <body>
    <script>
      // Multi-attempt auto-recovery for stale cached assets after deploy.
      // Layer 1: cache-busted redirect (defeats intermediary proxies).
      // Layer 2: verify via build-version.txt, then redirect to /index.html directly.
      // Layer 3: give up gracefully with a visible error message.
      window.addEventListener('error', function(e) {
        var tag = e.target && e.target.tagName;
        if (tag !== 'SCRIPT' && tag !== 'LINK') return;

        // Only OUR OWN assets can be stale-cached, so only they should trigger the
        // reload ladder below. A third-party stylesheet that fails (the Google font
        // CDN is blocked outright on many privacy-filtered networks) is not evidence
        // of a bad deploy, and reloading twice over it would be a self-inflicted
        // outage for those users.
        var src = e.target.src || e.target.href || '';
        if (src && src.indexOf(window.location.origin) !== 0) return;

        // Attempt state is read from BOTH sessionStorage and the URL, and the URL is
        // authoritative for termination. Storage alone is not safe to depend on: a browser
        // that accepts setItem but never persists it (private modes, blocked site data,
        // partitioned storage) makes every reload look like attempt 0, so the ladder below
        // never reaches its ceiling and redirects forever. Measured against a fixture with
        // exactly that storage shape: 1,069 requests in 8 seconds. Carrying the counter in
        // the query string removes the dependency entirely - location.replace always
        // preserves it - so the worst case is two redirects and the fallback error.
        var attempt = 0;
        var fromUrl = /[?&]_r=(\d+)/.exec( window.location.search );
        if ( fromUrl ) { attempt = parseInt( fromUrl[ 1 ], 10 ) || 0; }
        try {
          var raw = sessionStorage.getItem( '__wikantik_reload' );
          if ( raw ) {
            var st = JSON.parse( raw );
            if ( st && st.attempt > attempt ) { attempt = st.attempt; }
          }
        } catch ( _ ) { /* storage unavailable - the URL counter carries it */ }

        function remember( n ) {
          try {
            sessionStorage.setItem( '__wikantik_reload', JSON.stringify( { attempt: n, ts: Date.now() } ) );
          } catch ( _ ) { /* best effort; _r in the URL is the durable copy */ }
        }
        // Rewrite rather than append: the previous version concatenated a fresh _cb onto the
        // existing query string every time, so a loop produced an ever-growing URL.
        function retryUrl( path, n ) {
          var params = new URLSearchParams( window.location.search );
          params.set( '_r', String( n ) );
          params.set( '_cb', String( Date.now() ) );
          return path + '?' + params.toString();
        }

        if ( attempt >= 2 ) {
          // Ladder exhausted - stop redirecting and tell the user.
          showFallbackError();
          return;
        }

        if ( attempt === 0 ) {
          // Attempt 1: cache-busted redirect - defeats intermediary proxies holding a stale asset.
          remember( 1 );
          window.location.replace( retryUrl( window.location.pathname, 1 ) );
          return;
        }

        // Attempt 2: only redirect again if the server really is serving a newer build than
        // the one this document was stamped with; otherwise the assets are not stale and
        // another reload would achieve nothing.
        remember( 2 );
        fetch( '/build-version.txt?_cb=' + Date.now() )
          .then( function( r ) { return r.ok ? r.text() : null; } )
          .then( function( serverVer ) {
            var metaEl = document.querySelector( 'meta[name="build-version"]' );
            var myVer = metaEl ? metaEl.getAttribute( 'content' ) : '';
            if ( serverVer && serverVer.trim() !== myVer ) {
              window.location.replace( retryUrl( '/index.html', 2 ) );
            } else {
              showFallbackError();
            }
          } )
          .catch( function() { showFallbackError(); } );
      }, true);

      function showFallbackError() {
        var el = document.getElementById('loading-error');
        if (el) { el.style.opacity = '1'; el.style.visibility = 'visible'; el.style.animation = 'none'; }
        var spinner = document.getElementById('loading-spinner');
        if (spinner) spinner.style.display = 'none';
        var msg = document.getElementById('loading-msg');
        if (msg) msg.style.display = 'none';
      }
    </script>
    <div id="modal-root"></div>
    <div id="root">
      <div id="loading-fallback">
        <h1>Wikantik</h1>
        <div id="loading-spinner"></div>
        <p id="loading-msg">Loading&hellip;</p>
        <div id="loading-error">
          <p><strong>Unable to load the application.</strong></p>
          <p>A newer version may be available. Please try reloading.</p>
          <a href="javascript:void(0)" onclick="sessionStorage.removeItem('__wikantik_reload');window.location.replace('/?_cb='+Date.now())">Reload</a>
        </div>
      </div>
    </div>
    <noscript>
      <div style="text-align:center;padding:4rem 2rem;font-family:'DM Sans',sans-serif;color:#2D2D2D">
        <h1 style="font-family:'Playfair Display',Georgia,serif">Wikantik</h1>
        <p>JavaScript is required to use Wikantik. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
