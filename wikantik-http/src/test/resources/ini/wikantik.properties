# Test-only SPI provider wiring so com.wikantik.api.spi.Wiki's static initializer can
# resolve a provider from this module's test classpath, which (unlike wikantik-main) has
# no real EngineSPIDefaultImpl et al. on it. See wikantik-http/src/test/java/com/wikantik/http/spi.
wikantik.provider.impl.acls=com.wikantik.http.spi.AclsSPITestImpl
wikantik.provider.impl.contents=com.wikantik.http.spi.ContentsSPITestImpl
wikantik.provider.impl.context=com.wikantik.http.spi.ContextSPITestImpl
wikantik.provider.impl.engine=com.wikantik.http.spi.EngineSPITestImpl
wikantik.provider.impl.session=com.wikantik.http.spi.SessionSPITestImpl
