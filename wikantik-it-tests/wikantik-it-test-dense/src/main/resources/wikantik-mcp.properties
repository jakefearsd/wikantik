# MCP settings for the dense IT wiki. Same as the shared Selenide module's file: the knowledge MCP is open, which
# is what lets PrivateClusterDenseIT call it as an anonymous (non-admin) caller.
mcp.server.name = wikantik-mcp
mcp.server.title = Wikantik Knowledge Base
mcp.server.version = 2.0.0
mcp.instructions.file = wikantik-mcp-instructions.txt
mcp.ratelimit.global = 0
mcp.ratelimit.perClient = 0
mcp.access.allowUnrestricted = true
