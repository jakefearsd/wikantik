# Engine properties for the REST IT module's wiki only, merged over the shared overlay through the property cascade
# (-Dwikantik.custom.cascade.1=<this file>, set in the module pom). A plain -D flag cannot set an engine property;
# the cascade file can, and being per module it leaves the sso, scim, dense and custom-jdbc wikis as they were.
wikantik.work.enabled = true
# Remember-me cookie authentication ON: the work key ITs (WorkKeySessionIT) prove a bearer key never logs its owner in
# through a WikantikUID cookie, which would pass vacuously with this off (the shipped default).
wikantik.cookieAuthentication = true
# The shortest claim the product allows, so WorkClaimExpiryIT can watch a lapse in about two minutes.
wikantik.work.claim.expiryMinutes = 1
