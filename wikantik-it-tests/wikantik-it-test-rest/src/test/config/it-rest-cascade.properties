# Engine properties for the REST IT module's wiki only, merged over the shared overlay through the property cascade
# (-Dwikantik.custom.cascade.1=<this file>, set in the module pom). A plain -D flag cannot set an engine property;
# the cascade file can, and being per module it leaves the sso, scim, dense and custom-jdbc wikis as they were.
wikantik.work.enabled = true
# Remember-me cookie authentication ON: the work key ITs (WorkKeySessionIT) prove a bearer key never logs its owner in
# through a WikantikUID cookie, which would pass vacuously with this off (the shipped default).
wikantik.cookieAuthentication = true
# The shortest claim the product allows, so WorkClaimExpiryIT can watch a lapse in about two minutes.
wikantik.work.claim.expiryMinutes = 1

# The work ITs fire many requests a second with one credential; the per-credential limit (default 20/s) is
# pinned by unit tests (WorkApiKeyFilterTest), so it is raised out of the way here rather than slowing every IT.
wikantik.work.api.rateLimit.perKey = 2000

# The notification dispatcher's interval (default 60 s). WorkNotifyIT polls for an inbox notice with a bounded await;
# two seconds keeps that wait short without sleeping in the test. Email and webhooks stay off in this module.
wikantik.work.notify.intervalSeconds = 2

# Attachment limits for WorkAttachmentIT: 64 KiB per file and 200000 bytes per item, so the 413 paths are exercised
# with small uploads instead of 10 MB / 50 MB ones (defaults 10485760 and 52428800).
wikantik.work.attachments.maxBytes = 65536
wikantik.work.attachments.maxItemBytes = 200000

# The code-host hook (WorkCodeHostIT): the endpoint is dark by default, so it is switched on here, and the body limit is
# 64 KiB (default 1048576) so the 413 path is exercised with a 70 KB body. Every other payload in that IT is a few KB,
# one ping is 20 KB.
wikantik.work.codehost.enabled = true
wikantik.work.codehost.maxBodyBytes = 65536
