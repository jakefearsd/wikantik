# RAG-as-a-Service context-bundle reranker (GET /api/bundle, assemble_bundle MCP).
# Listwise section reranker over the per-page shortlist.
#
# DEFAULT OFF: the 2026-06-13 LIVE end-to-end measurement (eval/bundle-corpus/
# baseline-notes.md) showed the listwise reranker is an ORDERING lever, not a
# recall lever - rerank recall == dense recall at the bundle's operating point -
# while adding ~1.5s/request. The bundle ships dense-ordered (already relevance-
# sorted) by default; flip 'enabled' to true to opt into reranked ordering.
# Type: boolean
wikantik.bundle.reranker.enabled = false
# Ollama model used for reranking when enabled=true. gemma4:e4b (think:false) is
# the shipped latency/quality pick.
# Type: string
wikantik.bundle.reranker.model = gemma4:e4b
# Ollama base URL for the reranker model; only consulted when enabled=true.
# Type: url
wikantik.bundle.reranker.base_url = http://inference.jakefear.com:11434
# Per-call reranker HTTP timeout, in milliseconds; only consulted when enabled=true.
# Type: int
wikantik.bundle.reranker.timeout_ms = 30000

# --- Deterministic rerank chain (Phase 1: composable reranking) ---

# Ordered, comma-separated stage names applied after RRF fusion, before dedup/top-N.
# Stages: mmr (lexical MMR diversity), metadata-boost (confidence tie-breaker, see below),
# llm (listwise LLM reranker; overrides reranker.enabled). Enable only after a measured
# recall@12 no-regression run (see eval/bundle-corpus/baseline-notes.md).
# Example: wikantik.bundle.rerank.chain = mmr
# Type: string
# Blank means: identity chain - bundle behavior is byte-identical to pre-chain (falls back to the legacy wikantik.bundle.reranker.enabled flag above).
wikantik.bundle.rerank.chain =

# MMR lambda: 1.0 = pure relevance (no diversity), 0.0 = pure diversity.
# Type: double
wikantik.bundle.rerank.mmr.lambda = 0.7

# metadata-boost stage: bounded confidence rank tie-breaker (AUTHORITATIVE up, STALE down) that nudges a
# candidate by up to +/-positions rank slots relative to the upstream order. Composes with mmr/llm (it
# boosts incoming RANK, not denseScore). Active only when 'metadata-boost' is in the chain AND a
# confidence lookup is wired. positions = max rank shift (0 disables). NOTE: ranks are integers, so a
# value below ~0.5 never reorders anything (silent no-op) and AUTHORITATIVE-over-PROVISIONAL needs > 1;
# 1.5 is the useful floor for a genuine tie-breaker, higher = more aggressive shuffling.
# Type: double
wikantik.bundle.rerank.metadata_boost.positions = 1.5
# Top-N candidates the metadata-boost stage may reorder.
# Type: int
wikantik.bundle.rerank.metadata_boost.window = 24

# --- Scheduled retrieval-quality eval (RetrievalEvaluationObservability Phase 1) ---

# Interval in hours between scheduled bundle-eval runs against eval/bundle-corpus.
# 0 = DISABLED (default) - a real run needs a live embedding index, so enable only in a
# deployment that has one. Each run persists recall@12 to bundle_eval_run and logs a
# regression WARN when any recall falls below its threshold floor (thresholds.properties).
# Type: double
wikantik.bundle.eval.interval.hours = 0
# Precision@K computed by each scheduled eval run.
# Type: int
wikantik.bundle.eval.precision_k = 12
# CSV of eval queries (query text + expected page/section) consulted by the
# scheduled eval run - only read when interval.hours > 0.
# Type: path
wikantik.bundle.eval.corpus = eval/bundle-corpus/queries.csv

# Per-page section shortlist depth for the context bundle. Raised 5 -> 20 on
# 2026-06-14: once contextual embeddings made section scores discriminative, the
# cap of 5 became the binding constraint and discarded measured recall (realized
# bundle recall@12 0.602 -> 0.685 when loosened). The bundle still returns the top
# MAX_SECTIONS overall; this only controls how many per page enter the candidate pool.
# Type: int
wikantik.bundle.sections_per_page = 20

# Bundle candidate source. Default true = retrieve the top-K chunks globally from the
# dense index (no page pre-select), group to sections. The 2026-06-14 measurement showed
# this realises the section-recall ceiling (recall@12 0.735) where the page-gated hybrid
# path only reaches ~0.685 (the page pre-select drops retrievable sections). Set false to
# fall back to the page-gated path.
# Type: boolean
wikantik.bundle.dense.enabled = true
# Bounds the global chunk fan-out when dense.enabled=true.
# Type: int
wikantik.bundle.dense.top_k = 300

# Knee cutoff: dynamic-N - return fewer, denser sections when dense relevance falls off a cliff,
# instead of always padding to the top-N.
# Type: boolean
wikantik.bundle.knee.enabled = false
# retain_ratio keeps sections whose dense score is >= retain_ratio x the top score
# (0.5 = at least half as strong as the best). Only consulted when knee.enabled=true.
# Type: double
wikantik.bundle.knee.retain_ratio = 0.5

# Chunk-level BM25 hybrid bundle source (default ON since 2026-06-18). Wraps the dense chunk
# source with a RAM Lucene BM25 chunk index + RRF fusion (the lexical half of "hybrid" at
# chunk granularity). The sweep found a STRICT improvement over dense-only with the tuned
# defaults below: similarity recall@12 0.711->0.737, overall 0.706->0.721, NO category regresses.
# Costs a second in-RAM index (~18.4k chunks, a few MB) built at startup; degrades to dense-only
# if that build fails. Set false to revert. See eval/bm25-chunk-spike/findings.md.
# Type: boolean
wikantik.bundle.bm25.enabled = true
# Bundle fusion weights (separate from the page-level wikantik.search.hybrid.rrf.* knobs).
# Tuned 2026-06-18: half the page-level BM25 weight + a tighter rrfK keep the similarity gain
# without the boundary@5 dip that the reused page weights (bm25=1.0) caused.
# Type: double
wikantik.bundle.bm25.bm25_weight = 0.5
# Dense-score fusion weight, paired with bm25_weight above.
# Type: double
wikantik.bundle.bm25.dense_weight = 1.5
# RRF fusion k constant for combining BM25 and dense chunk rankings.
# Type: int
wikantik.bundle.bm25.rrf_k = 20
# Number of fused chunk candidates kept before grouping to sections.
# Type: int
wikantik.bundle.bm25.truncate = 20
# BM25 chunk-index analyzer: standard | code. The 2026-06-19 evaluation
# (eval/bm25-chunk-spike/analyzer-and-efsearch-findings.md) showed the code-aware analyzer
# (WordDelimiter: camelCase + snake_case splitting) lets BM25 match identifier/code-symbol
# queries - but only pays off under a BM25-heavy fusion, which collapses natural-language recall.
# So it stays 'standard' globally; 'code' is for a future query-adaptive routing path, not a
# global flip. (Pairs with the bm25_weight/truncate knobs above.)
# Type: enum(standard|code)
wikantik.bundle.bm25.analyzer = standard

# --- Query decomposition (structure-conditional, default OFF) ---

# When enabled, comparative/multi-part queries are split into 2-4 sub-queries
# by the local LLM (fail-closed to single-pass on any error, and forced off
# whenever wikantik.genai.mode disallows chat inference), retrieved
# separately, and RRF-fused. Targets cross-page comparative ("X vs Y") queries.
# This whole wikantik.bundle.decomposition.* family is read by prefix
# (BundleDecompositionConfig.PREFIX) - these are declared examples at the
# real defaults, not commented-out placeholders.
# Type: boolean
wikantik.bundle.decomposition.enabled = false
# Ollama model used for query decomposition when enabled=true.
# Type: string
wikantik.bundle.decomposition.model = gemma4-assist:latest
# Ollama base URL for the decomposition model; only consulted when enabled=true.
# Type: url
wikantik.bundle.decomposition.base_url = http://inference.jakefear.com:11434
# Per-call decomposition HTTP timeout, in milliseconds.
# Type: long
wikantik.bundle.decomposition.timeout_ms = 4000
# Cap on the number of sub-queries the planner may return.
# Type: int
wikantik.bundle.decomposition.max_subqueries = 4
# Reciprocal-rank-fusion constant used when merging sub-query result sets.
# Type: double
wikantik.bundle.decomposition.rrf_k = 60
# Fusion strategy for sub-query result sets: rrf (score-summed, amplifies the majority
# topic - measured to hurt multi-hop recall) or roundrobin (reserves per-sub-query
# position so the minority side of a comparative query survives the top-N cut).
# Type: enum(rrf|roundrobin)
wikantik.bundle.decomposition.fusion = rrf

