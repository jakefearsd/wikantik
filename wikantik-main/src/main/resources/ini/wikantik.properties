# Google Drive connector (P2.3b). Syncs configured Drive folders (Docs->markdown, native md/txt) into
# derived pages via an OAuth2 refresh token. Requires wikantik.connectors.enabled=true AND a configured
# wikantik.connectors.crypto.key (the refresh token is stored encrypted). Obtain the refresh token via
# the admin consent flow at /admin/connector-oauth/gdrive/<id>/authorize (the redirect_uri below must
# match the one registered in the Google Cloud OAuth client).
# SECURITY: do NOT enable Google's HTTP wire logging in production (java.util.logging on
# com.google.api.client.http.HttpTransport at CONFIG/FINE) - it logs request/response bodies including
# OAuth tokens. It is off by default; leave it off.
#wikantik.connectors.gdrive.<id>.folder_ids   = <comma-separated Drive folder IDs>
#wikantik.connectors.gdrive.<id>.client_id     = <OAuth2 client id>
#wikantik.connectors.gdrive.<id>.client_secret = <OAuth2 client secret>
#wikantik.connectors.gdrive.<id>.redirect_uri  = https://<host>/admin/connector-oauth/gdrive/callback
#wikantik.connectors.gdrive.<id>.max_files     = 500
#wikantik.connectors.gdrive.<id>.export_mime   = text/markdown
#
#  GitHub connector: markdown files from a repository tree. Inject the token (a fine-grained PAT
#  with read-only Contents scope) once via:  POST /admin/connector-credentials/<id>/token
#
#wikantik.connectors.github.<id>.repo        = <owner>/<name>
#wikantik.connectors.github.<id>.branch      =
#wikantik.connectors.github.<id>.path_prefix =
#wikantik.connectors.github.<id>.max_files   = 500
#
#  Confluence Cloud connector: pages from a space (storage XHTML, converted to markdown at ingest).
#  Inject the Atlassian API token once via:  POST /admin/connector-credentials/<id>/api_token
#
#wikantik.connectors.confluence.<id>.base_url  = https://<site>.atlassian.net
#wikantik.connectors.confluence.<id>.space_key = <KEY>
#wikantik.connectors.confluence.<id>.email     = <account email>
#wikantik.connectors.confluence.<id>.max_pages = 500

# Connector credential encryption (P2.2). Base64-encoded 32-byte AES-256 master key. An invalid
# key (wrong length/encoding) is also treated as absent, logged with a warning - the key value
# itself is never logged. Generate: openssl rand -base64 32
# Type: secret
# Blank means: credential store disabled; connectors that need secrets (gdrive/github/confluence)
# cannot be authorised, and admin /admin/connector-credentials returns 503.
wikantik.connectors.crypto.key =

