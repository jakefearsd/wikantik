# Type: boolean
# Source: system-property
wikantik.kg.judge.allow_claude                          = false

# [Ontology]
# --- RDF/OWL ontology layer (Apache Jena, TDB2) ------------------------------

# Master switch for the ontology layer (OntologyWiringHelper). When false, no
# TDB2 store is built and /sparql, /id/{type}/{id} and /export/*.{ttl,nt}
# return "ontology disabled". The Knowledge Graph and page/cluster/tag concept
# projections are unaffected - this flag only gates their RDF materialization.
# Type: boolean
wikantik.ontology.enabled = true
# Directory for the Jena TDB2 store behind /sparql, /id/* and /export/*.
# The store is a rebuildable cache: deleting it and restarting triggers a
# full re-projection from PostgreSQL.
# Type: path
# Blank means: <wikantik.workDir>/ontology-tdb2 (or java.io.tmpdir/wikantik-ontology-tdb2 when workDir is unset)
wikantik.ontology.tdb2.dir =
# Hours between full nightly rebuilds of the TDB2 store from PostgreSQL - a
# reconciliation backstop that catches KG drift and any missed incremental
# sync events. 0 disables the scheduled rebuild entirely (incremental sync
# and the startup-if-empty self-heal still run).
# Type: long
wikantik.ontology.rebuild.interval.hours = 24
# Hours between periodic TDB2 compactions. The store's copy-on-write B+Trees
# never shrink on their own, so continuous rewriting (nightly rebuild + every
# incremental sync) only ever grows it - measured production growth is
# ~1.35 GB/day. Weekly is deliberately less aggressive than the daily rebuild
# interval; 0 disables scheduled compaction (same 0=disabled convention as
# the rebuild interval above).
# Type: long
wikantik.ontology.compaction.interval.hours = 168
# Event-incremental entity sync: re-project an entity's graph on KgChangeEvent
# (from both KG write funnels) instead of waiting for the nightly rebuild.
# When false, entity graphs are only refreshed by the nightly rebuild/backstop.
# Type: boolean
wikantik.ontology.incremental.enabled = true
# Coalescing window for incremental entity sync, in milliseconds - batches
# rapid-fire KgChangeEvents for the same entity into a single re-projection
# instead of re-projecting on every individual write.
# Type: long
wikantik.ontology.incremental.coalesce.ms = 500

