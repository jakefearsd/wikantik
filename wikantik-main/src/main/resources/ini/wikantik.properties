###########################################################################

# [General]
#
#  This is the Wikantik configuration file.  You'll need to edit this
#  a bit.  The first few lines are the most important ones.
#
#  If you don't want to edit this file, you can override each individual
#  property by specifying the property name as a standard
#  Java System Property.
#
#  Wherever it is said that an option can be "true" or "false", you can
#  also use "yes"/"no", or "on/off".  Just for some convenience.
#
#
#  You can use this to override the default application name.  It affects
#  the HTML titles and logging, for example.  It can be different from
#  the actual web name (http://my.com/mywiki) of the application, but usually
#  it is the same.
#  Type: string
wikantik.applicationName = Wikantik

#
#  The public base URL of this wiki instance (e.g. https://wiki.example.com),
#  used to build absolute URLs for SSO callback redirects, MCP sitemap/
#  structured-data/IndexNow tools, and connector OAuth redirect URIs. Engine.
#  getBaseURL() only returns the servlet context path, not a full origin.
#  Type: url
#  Blank means: falls back to the request's own scheme/host/context path
#  (BaseUrlResolver's 3-tier fallback), or to the context path alone where
#  no request is available (e.g. SSO callback URL construction).
wikantik.baseURL =

#  Directory holding the wiki's skin/template. "default" ships with Wikantik.
#  Type: string
wikantik.templateDir = default

#  If true, then the IP address of the editor is stored with the page data.
#  Type: boolean
wikantik.storeIPAddress = true

#  If true, then the user name will be stored with the page data.
#  Type: boolean
wikantik.storeUserName = true

#  SPI provider implementations (com.wikantik.api.spi.Wiki). Override only if
#  you are supplying a custom implementation of the AclsSPI interface; the
#  default is Wikantik's own.
#  Type: class
wikantik.provider.impl.acls = com.wikantik.spi.AclsSPIDefaultImpl
#  Override only if you are supplying a custom implementation of the
#  ContentsSPI interface; the default is Wikantik's own.
#  Type: class
wikantik.provider.impl.contents = com.wikantik.spi.ContentsSPIDefaultImpl
#  Override only if you are supplying a custom implementation of the
#  ContextSPI interface; the default is Wikantik's own.
#  Type: class
wikantik.provider.impl.context = com.wikantik.spi.ContextSPIDefaultImpl
#  Override only if you are supplying a custom implementation of the
#  EngineSPI interface; the default is Wikantik's own.
#  Type: class
wikantik.provider.impl.engine = com.wikantik.spi.EngineSPIDefaultImpl
#  Override only if you are supplying a custom implementation of the
#  SessionSPI interface; the default is Wikantik's own.
#  Type: class
wikantik.provider.impl.session = com.wikantik.spi.SessionSPIDefaultImpl

# [Page storage]
#
#  Which page provider class to use.  Possibilities are:
#
#    FileSystemProvider     - for simple pure file storage with no version information
#    VersioningFileProvider - for simple pure file storage with    version information
#
#  Type: enum(FileSystemProvider|VersioningFileProvider)
wikantik.pageProvider = VersioningFileProvider

#
# How to order pages in various lists and plugins.  By default, they are
# ordered using Java's "natural" String order (purely character by character
# comparison). This means that the pages named "Page1", "Page2" and "Page10"
# appear in the order "Page1", "Page10", "Page2".
#
# To specify a different ordering, give the fully qualified name of a String
# Comparator. If the class can't be found, an error will be logged and page
# sorting will fall back to the default "natural" ordering. You can specify
# any String Comparator class here BUT be careful of using case insensitive
# comparators as Wikantik page names may be case sensitive.
# Example: wikantik.pageNameComparator.class = my.fully.qualified.comparator
#
# For convenience, we have provided a few possibly useful comparators:
#
# HumanComparator understands numbers and sorts in a more human friendly
# order (English only).  Using HumanComparator, the pages "Page1", "Page2",
# "Page10" will sort in that order.
# Example: wikantik.pageNameComparator.class = HumanComparator
#
# LocaleComparator uses the server's Locale for ordering.  Useful if your
# content is always in a language other than English.  Does not do human
# friendly numeric ordering.
# Example: wikantik.pageNameComparator.class = LocaleComparator
#
#  Type: class
#  Blank means: Java's natural String ordering (the default described above).
wikantik.pageNameComparator.class =

#
#  Determines where wiki files are kept for FileSystemProvider i.e.:
#
#  Example: wikantik.fileSystemProvider.pageDir = /p/web/www-data/wikantik/
#
#  If you're using Windows, then you must duplicate the backslashes.
#  For example, use:
#
#  Example: wikantik.fileSystemProvider.pageDir = C:\\Data\\jspwiki
#
#  Type: path
#  Blank means: a "wikantik-files" directory in the user's home folder.
wikantik.fileSystemProvider.pageDir =

#  Number of page.properties entries VersioningFileProvider keeps in memory.
#  Set to 0 for single-entry, -1 for no caching.
#  Type: int
wikantik.versioningFileProvider.cacheSize = 100

# [Caches]
#
#  Set to true, if you want to cache page data into memory.  This is in general a good idea.
#
#  Default is true (use cache).
#
#  NB: This replaces the Wikantik 1.x "CachingProvider" setting, since it probably was too confusing.
#  Type: boolean
wikantik.cache.enable = true

#  TTL (in seconds) of the CachingProvider's "all pages" cache. When this TTL
#  expires, the next call to getAllPages() refreshes from the underlying
#  provider, allowing detection of externally added or removed pages.
#  Type: int
wikantik.cache.allPagesTTL = 300

#  Whether CachingProvider's filesystem watcher is enabled. When enabled, the
#  watcher monitors the page directory for external changes and triggers
#  cache invalidation.
#  Type: boolean
wikantik.cache.watcherEnabled = true

#  How often (in seconds) the filesystem watcher polls for external changes.
#  Type: int
wikantik.cache.watcherInterval = 3

#  Classpath location of the Ehcache XML configuration (bundled at
#  /ehcache-wikantik.xml inside wikantik-cache.jar). Override to ship a
#  custom cache configuration on the classpath instead. A missing resource
#  falls back to an in-code default cache set with no persistence tuning.
#  Type: path
#  Blank means: the bundled ehcache-wikantik.xml is used.
wikantik.cache.config-file =

#  Self-modification guard window (in milliseconds). Pages saved through
#  Wikantik's own API are suppressed in the filesystem watcher for this
#  duration, to avoid double-processing a save as an external change.
#  Type: long
wikantik.watcher.internalSaveGuardMillis = 5000

#  Comma-separated host:port list of memcached servers. Only consulted when
#  the opt-in wikantik-cache-memcached module is wired in (see its Javadoc);
#  the default CachingManager is EhCache and never reads this key.
#  Type: list
#  Blank means: memcached adapter disabled (EhCache is the default).
wikantik.cache.memcached.servers =

#  TTL, in seconds, for entries written by the memcached adapter.
#  Type: int
wikantik.cache.memcached.ttl = 86400

#  Reported max-entries for the memcached adapter's CacheInfo (a display value only -
#  memcached itself has no per-cache entry cap, so this does not enforce one).
#  Type: int
wikantik.cache.memcached.max-entries = 1000

#
#  The Wikantik working directory.  If not set, a temporary path will
#  be used.  You can see the location of the workdir in the logs.
#  It is HIGHLY recommended that you set this.
#
#  The working directory is used to cache things like Lucene search
#  results.
#  Type: path
#  Blank means: the ServletContext's temporary directory, or java.io.tmpdir
#  if that is unavailable.
wikantik.workDir =

# [Attachments]
#
#  ATTACHMENTS:
#
#  Use the following property to define which attachment provider
#  you want to use.  You have basically two choices:
#    * Set the value to BasicAttachmentProvider
#      a simple, flat file versioning provider
#    * Leave the value empty (or just comment the line out)
#      the attachment functionality is disabled
#  Type: class
wikantik.attachment.provider = BasicAttachmentProvider
# This property supersedes the deprecated wikantik.attachmentProvider below.
# Type: class
# Blank means: deprecated alias unset; falls back to wikantik.attachment.provider above.
wikantik.attachmentProvider =

#
#  The BasicAttachmentProvider needs to know where to store the files
#  the user has uploaded.  It's okay to put these in the same directory
#  as you put your text files (i.e. the pageDir setting above).
#
#  If you're using Windows, then you must duplicate the backslashes.
#  For example, use:
#
#  Example: wikantik.basicAttachmentProvider.storageDir = C:\\Data\\jspwiki
#
#  Type: path
#  Blank means: a "wikantik-files" directory in the user's home folder.
wikantik.basicAttachmentProvider.storageDir =

#
#  You can tell the BasicAttachmentProvider to add a flag
#  so that browsers do not cache certain (or all) attachment
#  types. This is useful in intranet environments. You should activate
#  this if your users complain that their excel files are not uploaded
#  correctly and they still do have an old version: Usually the
#  file was uploaded correctly, but they get the locally cached version
#
#  You can use regular expressions to disable the cache, e.g the
#  following example will disable browser cache for all excel and word files:
#  Example: wikantik.basicAttachmentProvider.disableCache = .*\.xls|.*\.doc
#  Type: string
#  Blank means: no filename pattern is excluded; browser caching is enabled
#  for all attachments.
wikantik.basicAttachmentProvider.disableCache =

#
#  You can limit the maximum size of an attachment by setting this
#  value.  The value is in bytes.
#  This limit is not enforced for users with AdminPermissions.
#
#  Example: the following would limit the attachment size to 100,000 bytes
#  Example: wikantik.attachment.maxsize = 100000
#  Type: int
#  Blank means: no limit (attachments up to Integer.MAX_VALUE bytes are accepted).
wikantik.attachment.maxsize =

#
#  By default, Wikantik accepts all types of attachments.  However, you
#  can allow some types only, or forbid some other types.  By default,
#  all file types are allowed (if you do not specify the "allow" list
#  at all, or it is empty).
# These allow/forbid statements are not enforced for users with AdminPermissions.
#
#  These both are space-separated lists of file suffixes
#
#  Example: Allow only PNG, JPG, ZIP and JAR file attachments
#  Example: wikantik.attachment.allowed=.png .jpg .zip .jar
#  Type: list
#  Blank means: all attachment file types are allowed (no restriction).
wikantik.attachment.allowed =

#  Example: Forbid HTML, PHP, ASP and EXE
#  Example: wikantik.attachment.forbidden = .html .htm .php .asp .exe
#  Type: list
#  Blank means: no attachment file type is forbidden (subject to wikantik.attachment.allowed above).
wikantik.attachment.forbidden =

# Attachment links to HTML, HTM and JS, etc. files will force a download rather than opening the attachment.
# Set to * to always enforce attachment download (or blank to force-download nothing).
# Space-separated list of file suffixes.
# Type: list
wikantik.attachment.forceDownload= .html .htm .js .pdf .svg .xml

# [Page references]
#
#  page Diff Representation
#
#  To show differences between page versions, you can define a
# difference provider.
#  The following choices are available:
#    * TraditionalDiffProvider - Uses internal (java) diff
#        to create a list of changes and shows it line by
#        line colored. This is the default
#    * ContextualDiffProvider - Uses internal (java) diff
#        to create changes inline and shows it on a word by
#        word basis using CSS. This is much superior to the
#        traditional diff provider, however, it is still quite
#        new and not much tested. YMMV.
#  Type: enum(TraditionalDiffProvider|ContextualDiffProvider)
wikantik.diffProvider = TraditionalDiffProvider

#  Number of unchanged characters shown around a change when using
#  ContextualDiffProvider, before the surrounding context is elided.
#  Type: int
wikantik.contextualDiffProvider.unchangedContextLimit = 1073741822

#
#  Page references
#
# The reference manager keeps track of wikipage references, that is, what pages a
# given page refers to, and they other way round, what pages refer to a given page.
# If using a custom reference manager, specify the ReferenceManager implementation
# class here (it is expected that the implementation will have a constructor
# receiving an Engine):
# Type: class
wikantik.refManager = com.wikantik.pagegraph.references.DefaultReferenceManager

# [Encoding]
#
#  Determines which character encoding Wikantik should use.  If you want
#  to support all languages in your Wiki, you probably want to enable
#  this.  From Wikantik 2.2, it is strongly suggested that you use UTF-8.
#
#  Note that you can't switch these in the meantime, since the way the
#  files are encoded on disk is incompatible between ISO-Latin1 and UTF-8.
#  Don't try.  You'll get all sorts of interesting problems, if you do.
#
#  Possible values are 'ISO-8859-1' and 'UTF-8' (default, if none has been specified).
#  Type: enum(ISO-8859-1|UTF-8)
wikantik.encoding = UTF-8

#
# The following 3 properties apply sensible constraints around custom page
# properties that can be saved into the AbstractFileProvider. These default
# values were chosen with future JDBC providers in mind.
# See: https://issues.apache.org/jira/browse/JSPWIKI-856
#
#custom.pageproperty.max.allowed=200
#custom.pageproperty.key.length=255
#custom.pageproperty.value.length=4096


#
#  Determines whether raw HTML is allowed as Wiki input.
#
#  THIS IS A DANGEROUS OPTION!
#
#  If you decide to allow raw HTML, understand that ANY person who has
#  access to your Wiki site can embed ANY sort of malicious JavaScript,
#  or plugin, or ActiveX, or whatever on your site.  They can even mess it
#  up so royally it is impossible for you to replace the situation without
#  the need of direct access to the repository.  So think twice before
#  allowing raw HTML on your own site.
#
#  Most probably you want to use this on Intranets, or personal servers,
#  where only a handful of people can access the wiki.
#
#  Text between {{{ and }}} -options is not affected by this setting, so
#  it's always safe to quote HTML code with those.
#

############################################################################

# [Rendering & wiki syntax]
#
#  Usability niceties.
#
#
#  If this property is set to "true", then page titles are rendered
#  using an extra space between every capital letter.  It may make
#  page titles readable on some occasions, but it does have the
#  drawback of making the titles look a bit funny at times.
#  Type: boolean
wikantik.breakTitleWithSpaces = false

#
#  If set to true, this property means that "WikiName" and "WikiNames"
#  are considered equal when linking between them.  Setting this to
#  true does not prevent you from having both kinds of pages - we just
#  fall back to the other one if the primary name does not exist.
#
#  For any other language, you'll probably want to turn this off.
#  Type: boolean
wikantik.translatorReader.matchEnglishPlurals = true

#
#  If you set this to true, the Wiki translator will then also consider
#  "traditional" WikiNames (that is, names of pages JustSmashedTogether
#  without square brackets) as hyperlinks.  This technique is also
#  known as "CamelCase", or "BumpyCase", or "InterCapping".  I personally
#  like CamelCase as a word, which is why this property is named as it is :-).
#
#  By default, this is false, since traditional WikiLinks may confuse newbies.
#
#  This option can be overridden on a per-page basis using the SET directive.
#  Type: boolean
wikantik.translatorReader.camelCaseLinks = false

#
#  The name of the front page.  This is the page that gets loaded if no
#  other page is loaded.  Up until Wikantik 1.9.28, it was always called
#  "Main", but now you can easily change the default front page here.
#  Type: string
wikantik.frontPage = Main

#
#  Allow creation of empty pages.
#  Type: boolean
wikantik.allowCreationOfEmptyPages = false

#  If set to "true", all external links are tagged with 'rel="nofollow"'.
#  Type: boolean
wikantik.translatorReader.useRelNofollow = false

#
#  If set to true, all outward links have a small icon attached.  The icon
#  can be found from images/out.png.  Default is true.
#  Type: boolean
wikantik.translatorReader.useOutlinkImage = true

# [Page storage]
#
#  Set this to the number of minutes a person can "lock" a page
#  for while he is editing it.
#  Type: int
wikantik.lockExpiryTime = 60

#  Comma-separated regular expressions naming additional system/template
#  pages, beyond the built-in template-directory discovery.
#  Type: list
#  Blank means: no additional system-page patterns.
wikantik.systemPages.extraPatterns =

#  Comma-separated, exact system-page names that remain editable via the MCP
#  update_page tool despite being system pages.
#  Type: list
wikantik.systemPages.mcpEditable = About

# [Search & hybrid retrieval]
#
#  Search provider used for searching pages and attachments.
#  Type: class
wikantik.searchProvider = LuceneSearchProvider

#
#  If your wiki's language is something else than English, you might
#  want to visit lucene.apache.org and download a proper Analyzer
#  for your language.
#  Type: class
wikantik.lucene.analyzer = org.apache.lucene.analysis.classic.ClassicAnalyzer

#
#  Lucene background updater timing (LuceneSearchProvider.LuceneUpdater).
#
#  Seconds the updater thread sleeps between drains of the pending-page
#  update queue - the steady-state cadence at which saved pages become
#  searchable.
#  Type: int
wikantik.lucene.indexdelay = 5

#  Seconds the updater waits after startup before its first pass, so the
#  rest of engine startup settles before the index is touched.
#  Type: int
wikantik.lucene.initialdelay = 60

#  How often, in seconds, the updater checks for pages that exist on disk
#  but are missing from the index (a self-healing sweep). 0 disables the
#  periodic check.
#  Type: int
wikantik.lucene.missingPageCheckInterval = 300

#  Whether Lucene search results carry a highlighted excerpt (a fragment
#  around the matching terms) via DefaultLuceneSearcher's Highlighter.
#  Off by default; the current UI does not render the highlighted snippet,
#  so this only matters for direct three-arg findPages(query, FLAG_CONTEXTS,
#  ctx) callers.
#  Type: boolean
wikantik.search.highlighter.enabled = false

############################################################################

#
#  Hybrid retrieval query-time embedder (QueryEmbedderConfig). Wraps the
#  embedding backend with a timeout, an in-memory Caffeine cache, a circuit
#  breaker, and per-call metrics. Every user search calls the embedder;
#  these knobs bound how much damage a flaky backend can cause. Values
#  below are the QueryEmbedderConfig DEFAULT_* constants.
#
#  Per-call embed timeout, in milliseconds.
#  Type: long
wikantik.search.hybrid.embedder.timeout-ms = 2000

#  TTL for a cached query vector, in seconds.
#  Type: long
wikantik.search.hybrid.embedder.cache.ttl-seconds = 14400

#  Caffeine cache maximum size (distinct cached query vectors).
#  Type: long
wikantik.search.hybrid.embedder.cache.max-entries = 1000

#  Rolling window of recent calls the circuit breaker uses to evaluate the
#  failure rate.
#  Type: int
wikantik.search.hybrid.embedder.breaker.window-size = 20

#  Minimum observations in the window before the breaker will consider opening.
#  Type: int
wikantik.search.hybrid.embedder.breaker.min-calls = 10

#  Failure rate (0.0-1.0) that trips the breaker open.
#  Type: double
wikantik.search.hybrid.embedder.breaker.failure-rate = 0.5

#  How long the breaker stays OPEN before a probe is allowed, in milliseconds.
#  Type: long
wikantik.search.hybrid.embedder.breaker.cooldown-ms = 30000

############################################################################

# [URL construction]
#
#  Special page references.
#
#  The URL is relative to Wiki.jsp.  However, if you use
#  a full, absolute URL, you can also do that.
#
# Example: redirect all requests to a page called 'OriginalWiki'
# to the original wikiwiki at http://c2.com/cgi/wiki
# Example: wikantik.specialPage.OriginalWiki = http://c2.com/cgi/wiki
#
#  Note that it is entirely possible to override any Wiki page, even
#  an existing one by redefining it here. Each entry maps a special-page
#  name to the relative path (or absolute URL) that serves it.
#  Type: string
wikantik.specialPage.CreateGroup = new-group
# Serves the search page.
# Type: string
wikantik.specialPage.Search = search
# Serves the login page.
# Type: string
wikantik.specialPage.Login = login
# Alias for CreateGroup.
# Type: string
wikantik.specialPage.NewGroup = new-group
# Serves the user-preferences page.
# Type: string
wikantik.specialPage.UserPreferences = preferences
# Serves the workflow page.
# Type: string
wikantik.specialPage.Workflow = workflow
# Serves the logout action.
# Type: string
wikantik.specialPage.Logout = logout
# Serves profile creation. Currently routed through the login page.
# Type: string
wikantik.specialPage.CreateProfile = login
# Serves profile editing. Currently routed through the preferences page.
# Type: string
wikantik.specialPage.EditProfile = preferences
# Alias for UserPreferences.
# Type: string
wikantik.specialPage.Preferences = preferences
# Alias for Search.
# Type: string
wikantik.specialPage.FindPage = search

#############################################################################

# [Plugins]
#
#  Plugin search paths.
#
#  Define here the packages you want to use for searching plugins,
#  separated with commas.
#  For example, use this to add "org.myorganisation.wikantik.myplugins"
#  and "com.foobar.myplugins" to the search path (comma-separated).
#
#  The default path is "com.wikantik.plugin", and it will be always
#  the last item on the path.  This allows you to override Wikantik default
#  plugins.  Note that you are only adding to the path, not replacing it (ie.
#  the default path is never removed.)
#
#  If the path is not specified (and there is no jspwiki_module.xml with the
#  plugin JAR), you need to either declare the search path by hand, or
#  use a fully qualified name.
#
#  If you are a plugin developer, please consider deploying a jspwiki_module.xml
#  file with your plugin JAR, so that the user does not have to set the searchPath.
#  e.g. wikantik.plugin.searchPath = org.myorganisation.wikantik.myplugins,com.foobar.myplugins
#  Comma-separated list of package names.
#  Type: list
#  Blank means: no extra package added; only the built-in com.wikantik.plugin path is searched.
wikantik.plugin.searchPath =

# You can specify external jars containing plugin classes. These will be added to the classpath
# when plugins are loaded.
# Using this you don't have to put the jars in your WEB-INF/lib directory thereby preventing war-surgery.
# Comma-separated list of jar paths.
# Type: list
# Blank means: no extra jars are added to the plugin classpath.
wikantik.plugin.externalJars =

#############################################################################

# [Page filters]
#
#  Page filters
#
#  Normally, the filter configuration is in your WEB-INF/ directory, so you
#  do not need to go and specify this.  However, if your filters.xml live somewhere
#  else, you'll have to specify it here.
#  Example: wikantik.filterConfig = /some/path/to/your/filters.xml
#  Type: path
#  Blank means: looked up as /WEB-INF/filters.xml in the servlet context,
#  then as /filters.xml on the classpath.
wikantik.filterConfig =

#############################################################################

# [URL construction]
#
#  URL Constructor
#
#  Wikantik by default generates page and attachment links that use JSP
#  pages and request parameters. It can also use alternative URL
#  constructors so that URL pages resemble traditional website paths, too.
#  You have three choices for generating URLs:
#
#     DefaultURLConstructor - uses JSPs for all references:
#         http://mywiki.com/wikantik/Wiki.jsp?page=Main
#         http://mywiki.com/wikantik/Edit.jsp?page=Main
#
#     ShortURLConstructor - uses path-like reference style:
#         http://mywiki.com/wikantik/wiki/Main
#         http://mywiki.com/wikantik/wiki/Main?do=Edit
#
#     ShortViewURLConstructor - uses path-like references for views; JSPs for everything else:
#         http://mywiki.com/wikantik/wiki/Main
#         http://mywiki.com/wikantik/Edit.jsp?page=Main
#
#  Of course, you can also write your own implementation if you wish.
#
#  For either of the ShortURL constructors, you can also specify a
#  prefix path to go in front of page names. By default, the
#  prefix is 'wiki/'.
#
#  Be warned that the ShortURLConstructor does not work well with any other editor
#  except the built-in plaintext one.  Use ShortViewURLConstructor if you plan
#  to enable any other ones. e.g. DefaultURLConstructor.
#  Type: enum(DefaultURLConstructor|ShortURLConstructor|ShortViewURLConstructor)
wikantik.urlConstructor = ShortViewURLConstructor
#  This prefix must be in some elements of web.xml, too: in
#  servlet-mapping of WikiServlet, in filter-mapping of WikiJSPFilter
#  Type: string
wikantik.shortURLConstructor.prefix = wiki/

#############################################################################

# [Sitemap & SEO]
#
#  Sitemap Configuration
#
#  When Wikantik runs behind a reverse proxy that terminates SSL (like
#  cloudflared, nginx, or a load balancer), the sitemap.xml URLs may
#  incorrectly use http:// instead of https://. Use this property to
#  explicitly set the base URL for sitemap generation, e.g.
#  https://wiki.example.com or https://wiki.example.com/Wikantik.
#  Type: url
#  Blank means: the base URL is derived from the incoming request, which
#  works correctly when Wikantik handles SSL directly.
wikantik.sitemap.baseURL =

#  Public base URL used to build absolute citation links in wikantik-tools
#  (OpenAPI, /tools/*) responses. The /tools server does not read this file at
#  all - it reads its own copy of this same key from wikantik-tools.properties
#  (ToolsConfig.publicBaseUrl()); declared here too because every wikantik.*
#  key belongs in this file's inventory regardless of which module reads it.
#  Type: url
#  Blank means: callers fall back to the incoming request's own scheme/host.
wikantik.public.baseURL =

#  Explicit base URL for Atom feed (<link>, entry permalinks) generation,
#  mirroring wikantik.sitemap.baseURL above for the same reverse-proxy case.
#  Type: url
#  Blank means: the same request-derived 3-tier fallback as wikantik.baseURL.
wikantik.feed.baseURL =

#############################################################################

# [Recent articles]
#
#  Configuration for the "recent articles" feature (REST endpoints, wiki
#  plugin, and JSP tags all share this manager).

#  How long (in seconds) a recent-articles result set is cached before being
#  recomputed.
#  Type: int
wikantik.recentArticles.cacheTTL = 60

#  Default number of articles returned when a caller does not specify a count.
#  Type: int
wikantik.recentArticles.defaultCount = 10

#  Default length (in characters) of the generated excerpt per article.
#  Type: int
wikantik.recentArticles.defaultExcerptLength = 200

#  Comma-separated regular expressions matching page names to exclude from
#  recent-articles results, in addition to the built-in system-page exclusion.
#  Type: list
#  Blank means: no additional pages excluded.
wikantik.recentArticles.excludePatterns =

#############################################################################

# [Rendering & wiki syntax]
#

# Markup parser class name; it must be a subclass of com.wikantik.parser.MarkupParser
# Type: class
wikantik.renderingManager.markupParser=com.wikantik.parser.markdown.MarkdownParser

# Wiki renderer that outputs XHTML; it must be a subclass of com.wikantik.render.WikiRenderer
# Type: class
wikantik.renderingManager.renderer=com.wikantik.render.markdown.MarkdownRenderer

# WYSIWYG renderer class name used by the editor preview path; it must be a
# subclass of com.wikantik.render.WikiRenderer.
# Type: class
wikantik.renderingManager.renderer.wysiwyg=com.wikantik.render.markdown.MarkdownRenderer

# Allow HTML in Markdown pages (needed for <div class="..."> styling blocks)
# Type: boolean
wikantik.translatorReader.allowHTML=true

#############################################################################

# [Authentication]
#
#  Security, authentication and authorization
#

#  Wikantik supports a plugin-based interface for talking to different
#  kinds of authentication and authorization systems. By "authentication,"
#  we mean a system for logging in a user to establish their identity.
#  By "authorization," we mean a system for figuring out what actions
#  users can perform based on their authenticated identities.
#
#  For users looking to get started quickly, the default settings below
#  should work fine. In addition to the properties below, you may also
#  want to modify the security policy file WEB-INF/wikantik.policy. See
#  the policy file for more details.
#
#  AUTHENTICATION
#
#  For authentication, Wikantik uses JAAS (Java Authentication and Authorization
#  Service) in combination with a servlet filter that picks up any credentials
#  set by the servlet container. The Authentication system is configured below.
#
#  You must choose either (A) Container or (B) Custom authentication. (B) is the default.
#
#  A) CONTAINER AUTHENTICATION
#  Wikantik will always (passively) collect credentials supplied by your servlet
#  container, via HttpServletRequest.getUserPrincipal/getRemote user. You do not
#  need to do anything to enable this. In addition, you can cause Wikantik users
#  to log in to the web container by uncommenting the the <security-constraint>
#  elements in WEB-INF/web.xml.
#
#  B) CUSTOM AUTHENTICATION
#  If you do not wish to use container-managed authentication, you can use Wikantik's
#  own custom authentication system. This uses a JAAS LoginModule (supplied below)
#  to log in the user. You can use any JAAS LoginModule you want.
#  The default class is com.wikantik.auth.login.UserDatabaseLoginModule,
#  which compares the supplied username and hashed password with the values stored
#  in the configured UserDatabase (see USER DATABASE below).
#
#  Supply the JAAS LoginModule class used for custom authentication here.
#  The implementation MUST have a zero-argument constructor (as noted in the
#  javax.security.auth.spi.LoginModule Javadocs).
#  Type: class
wikantik.loginModule.class = com.wikantik.auth.login.UserDatabaseLoginModule

#
# JAAS LoginContext parameters used to initialize the LoginModule. Replace 'param1'
# etc. with the actual parameter names your custom LoginModule expects; the names and
# values are loaded into a Map and passed to the LoginModule as the 'options' parameter
# when its initialize() method is called. The default UserDatabaseLoginModule class does
# not need any options, so no wikantik.loginModule.options.* key is declared here by
# default; setting one with UserDatabaseLoginModule active has no effect.
# Example: wikantik.loginModule.options.param1 = value1
# Example: wikantik.loginModule.options.param2 = value2

#
# Login Throttling - Whether logins should be throttled to limit bruce-force attempts.
# Type: boolean
wikantik.login.throttling=true

# [Security & passwords]
#
#  Wiki-variable name for a legacy master-password override. DefaultVariableManager
#  unconditionally blocks this exact name from ever resolving through the [{$var}]
#  wiki-variable syntax (THE_BIG_NO_NO_LIST), regardless of whether a value is set
#  here - so a value in this file would never be exposed to page markup either way.
#  Kept blank; nothing in this codebase otherwise reads this key.
#  Type: secret
#  Blank means: no master password is set (recommended - see above).
wikantik.auth.masterpassword =

#  TTL, in seconds, of the short-lived cache of successful bcrypt password
#  verifications (AbstractUserDatabase). Speeds up stateless HTTP Basic clients
#  (monitoring pollers, cron jobs, CI scripts) that resend credentials on every
#  request and would otherwise pay a full ~150-250ms bcrypt key-stretch each time.
#  A value <= 0 disables the cache entirely. Read via System.getProperty, not from
#  this file - set it as a JVM system property (-Dwikantik.auth.password.verifyCache.ttlSeconds=...).
#  Type: long
#  Source: system-property
#  Blank means: 60 seconds (the built-in default).
wikantik.auth.password.verifyCache.ttlSeconds =

#  Minimum acceptable password length (NIST 800-63B: length over complexity rules).
#  Type: int
wikantik.password.minLength = 8

#  Maximum acceptable password length.
#  Type: int
wikantik.password.maxLength = 128

#  Whether new/changed passwords are checked against a bundled common-passwords
#  blocklist and rejected if found.
#  Type: boolean
wikantik.password.blocklist.enabled = true

#  Kill switch for JDBCPlugin, which executes page-authored SQL (via [{JDBC ...}])
#  against the wiki's own datasource using the high-privilege application DB role.
#  Ships disabled: enabling it means any editor with edit permission on a page can
#  run arbitrary SQL as that role. Turn it on only if you accept that exposure, and
#  pair it with the plugin's own admin-permission check.
#  Type: boolean
wikantik.plugin.jdbc.enabled = false

#  Bootstrap admin override: the named user bypasses all policy checks (gets
#  AllPermission) for wikantik.admin.bootstrap.maxAgeSeconds after startup. Intended
#  only for recovering access to a fresh or locked-out installation; remove this
#  property once a real admin account is confirmed working.
#  Type: string
#  Blank means: no bootstrap admin override is active.
wikantik.admin.bootstrap =

#  Lifetime, in seconds, of the wikantik.admin.bootstrap override, starting at
#  server startup.
#  Type: long
#  Blank means: 86400 seconds (24 hours).
wikantik.admin.bootstrap.maxAgeSeconds =

# [Cookies & sessions]
#
#  Cookie authentication & assertion
#
#  If this value is set to "true", then Wikantik will allow you to "assert" an
#  identity using a cookie.  It's still considered to be unsafe, just like no
#  login at all, but it is useful when you have no need to force everyone to login.
#
#  By default, this is on.
#  Type: boolean
wikantik.cookieAssertions = true

#
#  If you would like to keep your users logged in for weeks at a time, you can
#  turn on "cookie authentication" feature.  However, this comes with important
#  security caveats:
#  1) User will stay logged in into your system for weeks.  This means that if
#     someone manages to nab the cookie during this time, they can pretend to
#     be that user.
#  2) The mappings between cookies and users are written in your filesystem,
#     in $wikantik.workDir/logincookies.  Access to this directory means that
#     the ability to fake anyone in the wiki, so please make sure that only
#     the proper admin has read access to this directory.
#
#  When enabled, a successful password login also issues a remember-me cookie
#  (WikantikUID): httpOnly, SameSite=Lax, Secure when the request is HTTPS, and an
#  opaque server-validated token (not a forgeable credential). Because it is Lax,
#  a later request silently re-authenticates after the server session is gone
#  (Tomcat restart/redeploy, session timeout) instead of bouncing the user to the
#  login screen - recommended to avoid surprise logouts on deploy. Logout clears
#  it. SSO users are unaffected (they re-auth via the IdP session).
#
#  By default, cookie authentication is off; set to true to enable remember-me.
#  Type: boolean
wikantik.cookieAuthentication = false

#
#  Defines how many days the cookies are kept, and how often the people have to log in.
#  The default is two weeks, i.e. 14 days.  If you need a shorter period than one day,
#  turn off cookie authentication, then tweak your web.xml to allow for longer sessions.
#  Type: int
wikantik.cookieAuthentication.expiry = 14

# [SSO]
#
#  SINGLE SIGN-ON (SSO)
#
#  Wikantik supports enterprise Single Sign-On via OIDC (OpenID Connect) and
#  SAML 2.0 protocols using the pac4j library. This allows users to authenticate
#  with external Identity Providers such as Azure AD, Okta, Google Workspace,
#  Keycloak, PingFederate, ADFS, and others.
#
#  To enable SSO, set wikantik.sso.enabled=true and configure the appropriate
#  protocol settings below. When SSO is enabled, a "Login with SSO" button will
#  appear on the login page. All wikantik.sso.* properties below are read directly
#  from this file (not bridged through JAAS LoginModule options), so leaving them
#  at their shipped blank/default values keeps SSO fully off regardless of what
#  else is set - only wikantik.sso.enabled turns it on.
#  Type: boolean
wikantik.sso.enabled = false

#  SSO type: "oidc" for OpenID Connect, "saml" for SAML 2.0, or "both".
#  Type: enum(oidc|saml|both)
wikantik.sso.type = oidc

#  --- OIDC (OpenID Connect) Configuration ---

#  Required when wikantik.sso.type = oidc or both.
#
#  The OIDC discovery URI (/.well-known/openid-configuration endpoint).
#  Type: url
#  Blank means: OIDC is not configured; if SSO is enabled with an oidc/both type,
#  no OIDC client is built and an error is logged (SSO falls back to any
#  configured SAML client, or to no SSO at all).
wikantik.sso.oidc.discoveryUri =

#  The OAuth 2.0 client ID issued by your Identity Provider.
#  Type: string
#  Blank means: OIDC is not configured (see wikantik.sso.oidc.discoveryUri).
wikantik.sso.oidc.clientId =

#  The OAuth 2.0 client secret issued by your Identity Provider. Never commit a
#  real value to version control; set it via wikantik-custom.properties instead.
#  Type: secret
#  Blank means: OIDC is not configured (see wikantik.sso.oidc.discoveryUri).
wikantik.sso.oidc.clientSecret =

#  The OIDC scopes to request.
#  Type: string
wikantik.sso.oidc.scope = openid profile email

#  --- Example: Google Workspace (OIDC) ---

#  1. Go to https://console.cloud.google.com/apis/credentials
#  2. Create an OAuth 2.0 Client ID (Web application type)
#  3. Add authorized redirect URI: https://wiki.jakefear.com/sso/callback
#  4. Set the values below (in wikantik-custom.properties), then enable SSO
#     via the property in the next line.
#
# Example: wikantik.sso.enabled = true
# Example: wikantik.sso.type = oidc
# Example: wikantik.sso.oidc.discoveryUri = https://accounts.google.com/.well-known/openid-configuration
# Example: wikantik.sso.oidc.clientId = <your-project>.apps.googleusercontent.com
# Example: wikantik.sso.oidc.clientSecret = <your-client-secret>
# Example: wikantik.sso.oidc.scope = openid profile email
# Example: wikantik.sso.autoProvision = true
# Example: wikantik.sso.claimMapping.loginName = email
# Example: wikantik.sso.claimMapping.fullName = name
# Example: wikantik.sso.claimMapping.email = email

#  --- SAML 2.0 Configuration ---

#  Required when wikantik.sso.type = saml or both.
#
#  Path to the Identity Provider's SAML metadata XML file.
#  Type: path
#  Blank means: SAML is not configured; if SSO is enabled with a saml/both type,
#  no SAML client is built and an error is logged.
wikantik.sso.saml.identityProviderMetadataPath =

#  The Service Provider entity ID (usually the wiki's URL).
#  Type: string
#  Blank means: SAML is not configured (see wikantik.sso.saml.identityProviderMetadataPath).
wikantik.sso.saml.serviceProviderEntityId =

#  Path to the SAML keystore (for signing/encryption).
#  Type: path
#  Blank means: no keystore is configured; SAML assertion signing/encryption that
#  needs one will fail if SAML is otherwise enabled.
wikantik.sso.saml.keystorePath =

#  Keystore password. Never commit a real value to version control; set it via
#  wikantik-custom.properties instead.
#  Type: secret
#  Blank means: no keystore password is configured.
wikantik.sso.saml.keystorePassword =

#  Private key password. Never commit a real value to version control; set it via
#  wikantik-custom.properties instead.
#  Type: secret
#  Blank means: no private key password is configured.
wikantik.sso.saml.privateKeyPassword =

#  SAML AuthnRequest binding type. Controls which binding pac4j uses when sending
#  the AuthnRequest to the IdP's SingleSignOnService; the value must match a
#  binding the IdP advertises in its metadata. HTTP-Redirect
#  (urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect) is the supported and
#  recommended binding - the SSORedirectServlet issues a 302 redirect carrying the
#  AuthnRequest as a query parameter. HTTP-POST AuthnRequest is not supported by
#  the current redirect servlet; do not set the HTTP-POST binding here unless the
#  redirect servlet is extended to render form-post content.
#  Type: string
#  Blank means: pac4j's own default binding is used (no explicit override).
wikantik.sso.saml.authnRequestBindingType =

#  Optional path where pac4j writes the generated SP metadata XML file. When set,
#  pac4j persists the SP's SPSSODescriptor (including the registered ACS URL) to
#  this file and re-reads it on restart; without this, pac4j holds the SP
#  metadata only in memory and may fail to resolve the ACS URL during assertion
#  validation against some IdP implementations.
#  Type: path
#  Blank means: pac4j keeps the SP metadata in memory only (not persisted to disk).
wikantik.sso.saml.serviceProviderMetadataPath =

#  --- Auto-Provisioning ---

#  When enabled, a local user profile is automatically created from IdP claims
#  on first SSO login.
#  Type: boolean
wikantik.sso.autoProvision = true

#  IdP claim treated as the immutable identity used to link an SSO login to a
#  local account (the account-link key). Set to "preferred_username" only if you
#  trust your IdP to keep that claim stable and unique - it is mutable at most
#  IdPs, unlike "sub".
#  Type: string
wikantik.sso.identityClaim = sub

#  --- Claim Mappings ---

#  Maps IdP claims/attributes to Wikantik user profile fields. These defaults
#  work with most OIDC providers (Azure AD, Google, Okta, Keycloak); override
#  only the ones your IdP names differently. Read via a dynamic
#  wikantik.sso.claimMapping.<field> prefix, so no explicit entry is required -
#  the examples below double as the built-in defaults.
# Example: wikantik.sso.claimMapping.loginName = preferred_username
# Example: wikantik.sso.claimMapping.fullName = name
# Example: wikantik.sso.claimMapping.email = email

#
# [Authorization]
#
#  AUTHORIZATION
#
#  For authorization, Wikantik has a two-tier system. When we want to
#  determine whether a user has permission to perform a certain action,
#  we first consult (A) an external "authorizer" to determine if the user
#  is a member of the required role. In addition to checking its external
#  authorizer, it also checks (B) its GroupManager for wiki-managed groups.
#
#  A) EXTERNAL AUTHORIZATION
#  By default, Wikantik uses the servlet container's authorization service
#  for to check what roles the user belongs to (that is, it calls
#  HttpServletRequest.isUserInRole(String)). After the user authenticates,
#  the default Authorizer (WebContainerAuthorizer) checks to see if the user
#  belongs to the roles listed in web.xml using <security-role>/<role-name> or
#  <auth-constraint>/<role-name> elements. However, you can use another
#  Authorizer if you wish; specify that class here.
#  Type: class
wikantik.authorizer = com.wikantik.auth.authorize.WebContainerAuthorizer

#  Security policy file name, resolved via Engine.findConfigFile (WEB-INF,
#  then classpath). The database-backed policy_grants table is used whenever
#  wikantik.datasource resolves, which is always in a supported deployment
#  (see the Database section); this file is the legacy fallback for a
#  deployment without a datasource and is otherwise never read.
#  Type: string
#  Blank means: the built-in default policy file name, "wikantik.policy".
wikantik.policy.file =

#  B) GROUPS
#  As an additional source of authorization, users can belong to discretionary
#  "wiki groups" that the users manage themselves. Wiki groups are stored in a
#  GroupDatabase. The default group database persists members in the configured
#  JDBC datasource (see the JDBC section below). Override with your own
#  GroupDatabase implementation with this property:
#  Type: class
wikantik.groupdatabase = com.wikantik.auth.authorize.JDBCGroupDatabase

#  The JDBC group database stores member lists in the configured datasource
#  (see the JDBC section below). Group create/modify metadata is maintained
#  automatically.

# [User database]
#  USER DATABASE
#  User's wiki profiles are stored in a UserDatabase. The default user database
#  persists profiles in the configured JDBC datasource (see the JDBC section
#  below). Override with your own UserDatabase implementation with this property:
#  Type: class
wikantik.userdatabase = com.wikantik.auth.user.JDBCUserDatabase

#  The JDBC user database stores usernames and salted-hashed passwords in the
#  configured datasource. See the JDBC section below and the JavaDoc for
#  com.wikantik.auth.user.JDBCUserDatabase for configuration details.

# [Access control lists]
#  ACCESS CONTROL LISTS
#  Last but not least, Wikantik needs a way of reading and persisting page
#  access control lists. The default implementation reads these from the page
#  markup. For example: "[{ALLOW edit Charlie}]". If using a custom
#  ACL manager, specify the AclManager implementation class here:
#  Type: class
wikantik.aclManager = com.wikantik.auth.acl.DefaultAclManager

# [REST API, MCP & agent surfaces]
#
#  Comma-separated list of Origin values allowed to make cross-origin state-
#  changing calls to /api/* and to receive CORS headers (see
#  RestServletBase.setCorsHeaders / CsrfProtectionFilter). Supports an exact
#  match per entry, or "*" for a single entry to allow any origin. The wiki's
#  session cookie is never exposed to cross-origin JS (Access-Control-Allow-
#  Credentials is never set), so this only affects unauthenticated/bearer-token
#  callers.
#  Type: list
#  Blank means: no cross-origin requests are allowed (same-origin only).
wikantik.cors.allowedOrigins =

#  D22: maximum permitted page body size, in bytes (UTF-8), accepted by
#  PUT/POST /api/pages. Requests over this limit are rejected with a 400 before
#  reaching the storage layer.
#  Type: int
wikantik.api.maxPageBytes = 262144

#  D20: opt-in strict-mode flag for PUT /api/pages. When true, callers must
#  supply expectedVersion; a request without one is rejected with a 400 to
#  avoid silently overwriting a concurrent update.
#  Type: boolean
wikantik.api.write.requireExpectedVersion = false

#  Comma-separated list of cluster paths whose page reads are always recorded
#  in the audit log, in addition to any page individually opted in via
#  frontmatter audit_reads: true (see AuditReadPolicy). Matching is by cluster
#  path as declared on the page's hub, not by page name.
#  Type: list
#  Blank means: no cluster is unconditionally read-audited (only per-page audit_reads: true opt-ins apply).
wikantik.audit.readClusters =

#  IndexNow API key used by the admin-mcp ping_search_engines tool to notify
#  IndexNow-participating search engines of changed pages. Generate one at
#  https://www.bing.com/indexnow and publish it at
#  https://<your-host>/<key>.txt as IndexNow requires.
#  Type: secret
#  Blank means: the tool's IndexNow ping is skipped with an explicit
#  "apiKey not configured" error; Google Sitemap Ping is unaffected.
wikantik.indexnow.apiKey =

#  Bearer token required by /scim/v2/* (SCIM 2.0 provisioning). Read only from
#  the wikantik.scim.token JVM system property (-Dwikantik.scim.token=...) or
#  the servlet's wikantik.scim.token init-param in web.xml - a value set here,
#  in wikantik.properties, is never read and has no effect.
#  Type: secret
#  Source: system-property
#  Blank means: no token is configured; every SCIM request is denied with 401.
wikantik.scim.token =

#  Login name of the fallback page owner recorded for agent-authored or
#  otherwise unattributable page saves (see PageOwnerService / the "agents"
#  service account). Stored at bootstrap only when it names a real user, so an
#  unseeded value degrades safely to no owner rather than a dangling reference.
#  Type: string
wikantik.page_ownership.default_owner = agents

#  Master flag for PageOwnershipSaveFilter, which records a page_owners row on
#  every save. Failures are logged and swallowed - ownership tracking never
#  blocks a save - so disabling this only stops new rows from being written.
#  Type: boolean
wikantik.page_ownership.enforcement.enabled = true

#############################################################################

# [InterWiki links]
#
# InterWiki links
#
# The %s is replaced with the page reference (specify
# multiple times to get multiple references).  Page references should
# appear in format : [wiki:wikipage].
#
# This is the Wikantik home.  In the future, Wikantik will probably rely on this
# for error messages, so I don't recommend that you change it.
# Type: url
wikantik.interWikiRef.Wikantik = http://wiki.wikantik.com/Wiki.jsp?page=%s

# Here's how you can have directly links to the Wikantik editor.
# Now you can put a hyperlink for editing "MainPage" by making
# a link [Edit:MainPage].
# Type: url
wikantik.interWikiRef.Edit = edit/%s

# A link to the raw wikimarkup of the page : [Raw:MainPage]
# Type: url
wikantik.interWikiRef.Raw = wiki/%s?skin=raw

# A link to the reader view of the page (no leftmenu, fit for printing) : [Reader:MainPage]
# Type: url
wikantik.interWikiRef.Reader = wiki/%s?skin=reader

#  A link to a Wiki Group, defined in the Group database.
#  Type: url
wikantik.interWikiRef.Group = group?group=%s

#  A link to the RSS feed for a page
#  Type: url
wikantik.interWikiRef.RSS = rss?page=%s&mode=wiki

#  This is the original WikiWikiWeb
#  Type: url
wikantik.interWikiRef.WikiWikiWeb = http://c2.com/cgi/wiki?%s

#  TWiki, a very nice WikiClone.
#  Type: url
wikantik.interWikiRef.TWiki = http://twiki.org/cgi-bin/view/TWiki/%s

#  MeatballWiki, which seems to be quite popular.
#  Type: url
wikantik.interWikiRef.MeatballWiki = http://usemod.com/cgi-bin/mb.pl?%s

#  Wikipedia, a Wiki encyclopedia!
#  Type: url
wikantik.interWikiRef.Wikipedia = http://www.wikipedia.com/wiki/%s

#  Google, the ubiquitous search engine.
#  Type: url
wikantik.interWikiRef.Google = http://www.google.com/search?q=%s

#  Google Maps, the ubiquitous internet map
#  Type: url
wikantik.interWikiRef.Location = https://maps.google.com/maps?q=%s

#  Wikantik documentation (for this release)
#  Type: url
wikantik.interWikiRef.Doc = http://wiki.wikantik.com/Wiki.jsp?page=%s

# JIRA Issue Tracker
# Type: url
wikantik.interWikiRef.JIRA = https://issues.apache.org/jira/browse/JSPWIKI-%s

############################################################################

#
# Define which image types are inlined.
# These are your standard glob expressions (just like in your
# Windows or UNIX shells).  If you specify additional numbered
# wikantik.translatorReader.inlinePattern.N entries below, they add to
# (not replace) this base pattern.
# Type: string
wikantik.translatorReader.inlinePattern = *.png

# Don't forget to increase the number after the dot - duplicate entries
# cause problems!
#
# Example:
#   Inline all JPG files and all files from images.com, in addition to PNGs:
#
# Example: wikantik.translatorReader.inlinePattern.1 = *.jpg
# Example: wikantik.translatorReader.inlinePattern.2 = http://images.com/*


###########################################################################

# [User preferences]
# User preferences

# Wikantik default locale for users. Wikantik establishes locale for its users
# based on the following order:
# 1.- user-preference settings
# 2.- if not set, see if there is a locale set server-side, as noted by
#     wikantik.preferences.default-locale setting on jspwiki[-custom].properties
# 3.- if not set, browser's preferred language setting
# 4.- if not set, JVM's default
# Example: wikantik.preferences.default-locale = en-us
# Type: string
# Blank means: no server-side override; falls through to the browser's
# preferred language, then the JVM's default.
wikantik.preferences.default-locale =

