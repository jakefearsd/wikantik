# --- Bundle coverage confidence thresholds (BundleCoverageCalculator) ---

# A section's dense cosine similarity at/above this counts as "strong" coverage.
# Type: double
wikantik.bundle.coverage.strong_similarity = 0.55
# A section's dense cosine similarity at/above this (but below strong_similarity)
# counts as "partial" coverage; below it counts as no coverage.
# Type: double
