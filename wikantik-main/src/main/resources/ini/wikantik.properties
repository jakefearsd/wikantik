# [Knowledge Graph & extraction]
# --- Hub Discovery (cluster-based) ---

# Minimum number of members for HDBSCAN to form a cluster.
# Below this, points are classified as noise.
# Type: int
wikantik.hub.discovery.minClusterSize = 3

# HDBSCAN minPts: density requirement for "core" points.
# Type: int
wikantik.hub.discovery.minPts = 3

# Safety floor: if the candidate pool has fewer non-member
# articles than this, skip the run entirely.
# Type: int
wikantik.hub.discovery.minCandidatePool = 6

# ----- Hub Overview (read-focused stats panel for already-accepted hubs) -----

# Minimum centroid cosine for a non-member article to count as a near-miss.
# Type: double
wikantik.hub.overview.nearMissThreshold = 0.50

# Minimum centroid cosine for two hubs to be considered "overlap" in the
# overlap-hubs section of the per-hub drilldown.
# Type: double
wikantik.hub.overview.overlapThreshold = 0.60

# Top-N near-miss articles returned in the drilldown's TF-IDF list.
# Type: int
wikantik.hub.overview.nearMissMaxResults = 10

# Top-N MoreLikeThis (Lucene) results returned in the drilldown.
# Type: int
wikantik.hub.overview.moreLikeThisMaxResults = 10

# ----- Hub proposal generation -----

# Only candidate clusters scoring at or above this percentile (of all
# candidate scores in the run) are filed as hub proposals for review -
# keeps the proposal queue to the strongest candidates instead of every
# HDBSCAN cluster found.
# Type: int
wikantik.hub.reviewPercentile = 50

# ----- Structural spine: page verification confidence -----

# A page's structural-index confidence decays once its last edit is older
# than this many days (ConfidenceComputer), independent of author trust.
# Type: int
wikantik.verification.stale_days = 90

# [Search & hybrid retrieval]
# ----- Content Chunking (save-time) -----

# Hard ceiling on a non-atomic chunk's size, in estimated tokens (1 token ~= 4
# chars). Oversized atomic blocks (fenced code, tables, short lists) pass
# through intact; oversized paragraphs fall back to sentence-level splitting
# to keep the embedder's context-window headroom.
# Type: int
wikantik.chunker.max_tokens         = 512

# Effective floor for chunk emission. A section's accumulated text below this
# threshold is held and merged forward into the next section (heading
# boundaries included), so short sibling sections coalesce into a single
# chunk of reasonable size. Default 150 tokens; raise to 200-300 for even
# coarser chunks (fewer extraction RPCs) at the cost of slightly diffuser
# embeddings on dense retrieval. Lower toward 50 to get more, smaller chunks
# with sharper per-chunk topicality.
#
# Note: changing this value shifts chunk boundaries, which changes
# content_hash and invalidates every row in kg_content_chunks,
# content_chunk_embeddings, and chunk_entity_mentions. Trigger a full content
# rebuild after editing.
# Type: int
wikantik.chunker.merge_forward_tokens = 150

# Cross-section fragment floor (tokens). A section whose whole text is below this
# is a "fragment": it merges forward into the next section and adopts that
# section's heading_path, instead of becoming its own tiny, low-signal chunk.
# Sections at/above the floor always stand alone under their own heading (so they
# stay findable and their citations are correctly anchored). Must be <=
# merge_forward_tokens. 0 disables the floor (every section stands alone). Changing
# this invalidates chunk content - trigger a full content rebuild after editing.
# Type: int
wikantik.chunker.fragment_floor_tokens = 24

# Sliding-window overlap (tokens). After chunking, each chunk's tail is prepended to
# the next chunk under the same heading_path, so a fact straddling a chunk boundary
# appears whole in at least one chunk. 0 disables overlap. The 2026-06-14 probe showed
# a small @5/@20 recall gain. Changing this invalidates chunk content - full rebuild after.
# Type: int
wikantik.chunker.overlap_tokens = 40

# Kill-switch for save-time chunking. Disable if a chunker bug is blocking
# page saves (ChunkProjector is failure-isolated, but this lets ops short
# out the code path entirely).
# Type: boolean
wikantik.chunker.enabled            = true

# ----- Async combined rebuild (Lucene + chunks) -----

# Kill-switch for the async post-save rebuild that drains Lucene writes and
# chunk re-projection after a page save.
# Type: boolean
wikantik.rebuild.enabled              = true
# Poll interval, in milliseconds, while waiting for the Lucene writer queue to drain.
# Type: int
wikantik.rebuild.lucene_drain_poll_ms = 2000

# ----- Hybrid retrieval: text embeddings (experimental) -----

#
# Master flag for the hybrid BM25 + dense retrieval path. When true
# (the default), /api/search fuses BM25 with dense embedding results.
# Fails closed to BM25-only if the embedding backend is unreachable or
# the query embedder circuit trips, so search stays usable regardless.
# Set to false to disable the dense path entirely (no embedding client
# is built and no bootstrap is scheduled).
# Type: boolean
wikantik.search.hybrid.enabled      = true

# Whether the ontology-aware query expansion joins hybrid retrieval: when
# true, a query is expanded via the materialized RDF ontology (broader/
# narrower/related terms) before search, if the ontology model is available.
# Default off (no expansion) - falls back to plain retrieval whenever the
# ontology is disabled or not yet built.
# Type: boolean
wikantik.search.ontologyExpansion.enabled = false

# ----- Hybrid page-level fusion (HybridConfig) -----

# How a page's per-chunk cosine scores collapse into one page-level score.
# Type: enum(max|mean_top_3|sum_top_3|sum_top_5)
wikantik.search.hybrid.page-aggregation = sum_top_3

# Reciprocal-rank-fusion constant for combining BM25 and dense page rankings.
# Type: int
wikantik.search.hybrid.rrf.k = 60

# BM25 side weight in the page-level RRF fusion.
# Type: double
wikantik.search.hybrid.rrf.bm25-weight = 1.0

# Dense side weight in the page-level RRF fusion.
# Type: double
wikantik.search.hybrid.rrf.dense-weight = 1.5

# Number of fused page candidates kept after RRF, before returning results.
# Type: int
wikantik.search.hybrid.rrf.truncate = 20

# Chunk fan-out considered per query on the dense side before page aggregation.
# Type: int
wikantik.search.hybrid.dense.chunk-top = 500

# Page candidates kept from the dense side after aggregation, before fusion.
# Type: int
wikantik.search.hybrid.dense.page-top = 100

# Which backend implementation to use. Currently supported: ollama.
# The client abstraction leaves room for future backends (e.g. Hugging
# Face TEI, OpenAI-compatible) - swapping is a config change, not a
# code change at call sites.
# Type: enum(ollama)
wikantik.search.embedding.backend   = ollama

# Root URL of the embedding server. Defaults to the dedicated inference
# host at inference.jakefear.com:11434. Override to http://localhost:11434
# if you are running Ollama on the same box as the wiki.
# Type: url
wikantik.search.embedding.base-url  = http://inference.jakefear.com:11434

# Optional bearer token, forwarded as `Authorization: Bearer <value>`.
# Type: secret
# Blank means: no Authorization header is sent (un-authenticated loopback deployments).
wikantik.search.embedding.api-key   =

# Which candidate model to load. The wiki currently experiments with
# three options, each with its own prefix/dimension characteristics:
#   nomic-embed-v1.5        - dim 768, asymmetric prefixes, Matryoshka
#   bge-m3                  - dim 1024, no prefix, dense + sparse capable
#   qwen3-embedding-0.6b    - dim 1024, Qwen3 instruction prompt on queries
# Type: string
wikantik.search.embedding.model     = qwen3-embedding-0.6b

# Optional override of the default Ollama model tag for the selected
# model - useful when a deployment has pulled a non-default quantization
# or Modelfile variant (e.g. `bge-m3:latest`, or a custom Qwen3 tag).
# Type: string
# Blank means: use EmbeddingModel.defaultOllamaTag() for the selected model.
wikantik.search.embedding.ollama-tag =

# Per-request HTTP timeout in milliseconds. CPU-only backends on the
# mini-PC reference class can take 100+ ms per document at batch 32 -
# keep this well above the expected tail latency.
# Type: int
wikantik.search.embedding.timeout-ms = 30000

# Maximum number of texts sent per backend round-trip. Larger batches
# amortize model-load overhead on first call and improve throughput on
# a warm GPU; smaller batches reduce tail latency on CPU backends.
# Type: int
wikantik.search.embedding.batch-size = 32

# Rows committed per transaction during a corpus backfill. A full backfill is
# hours of inference on a CPU embedder; committing only at the end means any
# interruption (crash, restart, redeploy) discards every embedded row. This
# bounds that loss to one commit window. Sized against inference cost, not
# commit cost - a commit is sub-millisecond next to seconds-per-chunk embedding,
# so there is no throughput reason to raise it. Must be > 0.
# Type: int
wikantik.search.embedding.commit-batch-size = 256

# ----- Dense retrieval backend (query-time) ----

# Dense retrieval backend on the production wiring path (SearchWiringHelper.
# resolveDenseBackend), used whenever a DataSource is wired. One of:
#   lucene-hnsw  - in-process Lucene HNSW ANN index (RAM), rebuilt on boot from
#                  content_chunk_embeddings; incremental upserts on save. Default
#                  (this is the docker1 production default).
#   pgvector     - pgvector HNSW lookup against content_chunk_embeddings.embedding.
#                  Requires V032 + the one-shot backfill at
#                  bin/db/one-shots/2026-05-20-backfill-chunk-embeddings.sh.
#   inmemory     - brute-force float[] scan. O(corpus) per query and per save;
#                  dev/small-corpus fallback only.
# Deliberately diverges from SearchSubsystemFactory.resolveFallbackDenseBackend,
# which defaults to 'inmemory' on the no-DataSource fallback path (the only
# backend that needs no DataSource) - do not "fix" the two to match; both
# defaults are pinned by DenseBackendResolutionTest.
# Type: enum(lucene-hnsw|pgvector|inmemory)
wikantik.search.dense.backend = lucene-hnsw

# pgvector HNSW ef_search recall/latency knob. Higher = better recall, more CPU.
# Default 100 is the design-doc baseline; 200-400 trade latency for recall on
# corpora where the parity smoke gate drifts.
# Type: int
wikantik.search.dense.pgvector.ef_search = 100

# Lucene HNSW dense backend (wikantik.search.dense.backend=lucene-hnsw).
# In-process approximate nearest-neighbour index held in RAM, rebuilt on boot
# from content_chunk_embeddings. Defaults match the pgvector HNSW index
# (HnswParams).
# Type: int
wikantik.search.dense.lucene.m = 16
# HNSW graph build-time candidate list size. Higher = better graph quality, slower builds.
# Type: int
wikantik.search.dense.lucene.ef_construction = 64
# HNSW query-time candidate list size. Higher = better recall, more CPU per query.
# Type: int
wikantik.search.dense.lucene.ef_search = 100

# ----- Lucene Directory backend (BM25 index storage) -----

# How Lucene reads its on-disk index files. One of:
#   nio   - NIOFSDirectory: per-read FileChannel.read() + buffer copy.
#           Conservative default; matches all pre-flag deploys.
#   mmap  - MMapDirectory: maps index files into virtual memory; reads served
#           by the OS page cache as memory accesses. Lucene's recommended
#           default on 64-bit Linux. A corrupt index page surfaces as SIGBUS
#           instead of IOException - more visible failure mode.
# Read once at provider init; identical across read and write paths.
# Type: enum(nio|mmap)
wikantik.search.lucene.directory.kind = nio

# [Knowledge Graph & extraction]
# --- Knowledge graph entity extraction (Phase 2) -----------------------------

# Backend default: ollama against the shared inference host. Flip to 'disabled'
# for zero save-time overhead, or to 'claude' to use the Anthropic SDK.
# Type: enum(ollama|disabled|claude)
wikantik.knowledge.extractor.backend                  = ollama
# Anthropic model id used when backend=claude. claude-haiku-4-5 is the
# recommended default for cost; swap to claude-sonnet-4-6 for higher quality
# on ambiguous corpora. Requires ANTHROPIC_API_KEY on the JVM environment.
# Type: string
wikantik.knowledge.extractor.claude.model             = claude-haiku-4-5
# Ollama tag used when backend=ollama; must serve structured JSON. gemma4-graph:12b is a
# Gemma 12B config purpose-tuned for KG extraction; think:false is sent per-request (Ollama
# can't bake it in). NOTE: KgJudgeConfig reads this same key, so the judge uses it too -
# decouple with a dedicated judge model key if the judge ever wants a different model.
# Type: string
wikantik.knowledge.extractor.ollama.model             = gemma4-graph:12b
# Base URL of the Ollama server used for KG entity extraction (and, absent a
# dedicated override, by KgJudgeConfig for the judge LLM too).
# Type: url
wikantik.knowledge.extractor.ollama.base_url          = http://inference.jakefear.com:11434
# Legacy alias for wikantik.knowledge.extractor.ollama.base_url, honoured only
# by KgJudgeConfig (an early draft of the docs used this name). base_url wins
# when both are set; this key exists only for deployments that never migrated.
# Type: url
# Blank means: falls back to wikantik.knowledge.extractor.ollama.base_url
wikantik.knowledge.extractor.ollama.endpoint          =
# Per-chunk HTTP timeout. Self-hosted Ollama with multi-thousand-token prompts
# can need well over 30s; 120s is the shipping default so batch jobs don't
# time out on every chunk against smaller hardware.
# Type: int
wikantik.knowledge.extractor.timeout_ms               = 120000
# Proposals below this confidence are dropped, not filed - keeps the proposal
# queue reviewable.
# Type: double
wikantik.knowledge.extractor.confidence_threshold     = 0.6
# Cap on the existing-node dictionary embedded in each extractor prompt.
# Bounds prompt size and keeps the cache prefix stable across pages.
# Type: int
wikantik.knowledge.extractor.max_existing_nodes       = 200
# Minimum interval between extraction runs for the same page, in ms. Protects
# the extractor from a re-save storm; set to 0 to disable.
# Type: int
wikantik.knowledge.extractor.per_page_min_interval_ms = 5000
# Max parallel extraction RPCs fired by the admin batch job. Save-time
# extraction is always serial; this only affects /admin/knowledge/extract-mentions.
# Clamped to [1, 4] at load time.
# Type: int
wikantik.knowledge.extractor.concurrency              = 2

# --- GenAI ceiling control (cost-control flags) --------------------------------

# Limits what LLM operations are allowed. One of:
#   full           - both embeddings and chat inference allowed (default / current behavior)
#   embeddings-only - embeddings for retrieval/search enabled only; no chat inference
#   none           - all LLM operations disabled
# An absent property means 'full' (silent - the normal state of existing deployments).
# A set-but-blank or unrecognized value also means 'full', with a logged warning, so
# operator typos and old deployments degrade gracefully. To enforce, watch the warn logs.
# Type: enum(full|embeddings-only|none)
wikantik.genai.mode = full

# --- Knowledge Graph subsystem master switch ----------------------------------

# When false, the Knowledge Graph feature set is not constructed at all:
# no KG services, no KG MCP tools (knowledge-mcp KG tools and admin-mcp KG
# curation tools are not registered), and /admin/knowledge-graph/* plus
# /api/page-knowledge/* return 503 naming this flag. Chunking and the
# embedding/dense-retrieval pipeline stay fully active - they are independent
# of the KG. Entity extraction is skipped regardless of
# wikantik.knowledge.extractor.backend. The ontology layer keeps its own flag
# (wikantik.ontology.enabled); with the KG off its entity projections no-op
# while page/cluster/tag concept graphs continue to work.
# Type: boolean
wikantik.knowledge.enabled = true

# --- KG inclusion / exclusion policy ----------------------------------------

# Cluster-primary, page-overridable, admin-administered policy for which pages
# contribute to the knowledge graph. See
# docs/superpowers/specs/2026-04-27-kg-inclusion-policy-design.md.
# Search remains governed by SystemPageRegistry.isSystemPage(); this layer
# only affects the KG.
#
# Master switch. Default true - wires the policy components into the engine
# at boot. Setting to false reverts to legacy behaviour (no exclusion).
# Type: boolean
wikantik.kg_policy.enabled                              = true

#
# Knowledge Graph staged validation - judge LLM
#
# Async judge LLM that promotes extractor proposals into materialised
# kg_nodes/kg_edges at tier='machine'; admin approval upgrades to tier='human'.
# Read paths default to min_tier='machine' (broader view); callers can pass
# min_tier=human for the strict view.
# Type: boolean
wikantik.kg.judge.enabled                               = true
# When unset, judge connection falls back to the extractor's
# wikantik.knowledge.extractor.ollama.base_url (then .ollama.endpoint, then the
# host compiled into KgJudgeConfig.DEFAULT_ENDPOINT - a private inference host
# that a fresh deployment must override). Override only to pin the judge to a
# different endpoint than the extractor.
# Type: url
# Blank means: falls back to wikantik.knowledge.extractor.ollama.base_url
wikantik.kg.judge.endpoint                            =
# When unset, judge model falls back to the extractor's
# wikantik.knowledge.extractor.ollama.model (then KgJudgeConfig.DEFAULT_MODEL).
# Override only to pin the judge to a different model than the extractor.
# Type: string
# Blank means: falls back to wikantik.knowledge.extractor.ollama.model
wikantik.kg.judge.model                               =
# How long Ollama keeps the judge model resident in memory between calls.
# Longer than the cron interval so the model stays loaded across batches -
# shorter values caused every cron pass to eat a cold-load on its first
# 1-2 proposals.
# Type: string
wikantik.kg.judge.keep_alive                          = 30m
# Whether the scheduled cron trigger runs the judge automatically.
# Type: boolean
wikantik.kg.judge.cron.enabled                          = true
# Minutes between scheduled judge runs.
# Type: int
wikantik.kg.judge.cron.interval_min                     = 5
# Maximum number of proposals processed per judge run.
# Type: int
wikantik.kg.judge.batch_size                            = 50
# Number of proposals judged in parallel per run.
# Type: int
wikantik.kg.judge.concurrency                           = 2
# Per-proposal judge LLM call timeout, in seconds.
# Type: int
wikantik.kg.judge.timeout_seconds                       = 120
# Maximum retry attempts for a single proposal before it is marked failed.
# Type: int
wikantik.kg.judge.max_attempts                          = 3
# Default tier for read paths when caller does not pass min_tier.
