wikantik.applicationName = Wikantik
wikantik.pageProvider = FileSystemProvider
wikantik.cache.enable = true
wikantik.attachment.provider = BasicAttachmentProvider
wikantik.diffProvider = TraditionalDiffProvider
wikantik.encoding = UTF-8
wikantik.translatorReader.allowHTML = false
wikantik.breakTitleWithSpaces = false
wikantik.translatorReader.matchEnglishPlurals = true
wikantik.translatorReader.camelCaseLinks = false
wikantik.templateDir = default
wikantik.translatorReader.useOutlinkImage = true
wikantik.lockExpiryTime = 60
wikantik.searchProvider = LuceneSearchProvider
wikantik.specialPage.CreateGroup = new-group
wikantik.specialPage.Search = search
wikantik.specialPage.Login = login
wikantik.specialPage.NewGroup = new-group
wikantik.specialPage.UserPreferences = preferences
wikantik.specialPage.Workflow = workflow
wikantik.specialPage.Logout = logout
wikantik.specialPage.CreateProfile = login
wikantik.specialPage.EditProfile = preferences
wikantik.specialPage.Preferences = preferences
wikantik.specialPage.FindPage = search
wikantik.plugin.searchPath =
wikantik.plugin.externalJars =
wikantik.renderingManager.markupParser=com.wikantik.parser.markdown.MarkdownParser
wikantik.renderingManager.renderer=com.wikantik.render.markdown.MarkdownRenderer
wikantik.renderingManager.renderer.wysiwyg=com.wikantik.render.markdown.MarkdownRenderer
wikantik.translatorReader.allowHTML=true
wikantik.loginModule.class = com.wikantik.auth.login.UserDatabaseLoginModule
wikantik.login.throttling=true
wikantik.authorizer = com.wikantik.auth.authorize.WebContainerAuthorizer
wikantik.groupdatabase = com.wikantik.auth.authorize.InMemoryGroupDatabase
wikantik.userdatabase = com.wikantik.auth.user.InMemoryUserDatabase
wikantik.aclManager = com.wikantik.auth.acl.DefaultAclManager
wikantik.interWikiRef.Wikantik = http://wiki.wikantik.com/Wiki.jsp?page=%s
wikantik.interWikiRef.Edit = edit/%s
wikantik.interWikiRef.Raw = wiki/%s?skin=raw
wikantik.interWikiRef.Reader = wiki/%s?skin=reader
wikantik.interWikiRef.WikiWikiWeb = http://c2.com/cgi/wiki?%s
wikantik.interWikiRef.TWiki = http://twiki.org/cgi-bin/view/TWiki/%s
wikantik.interWikiRef.MeatballWiki = http://usemod.com/cgi-bin/mb.pl?%s
wikantik.interWikiRef.Wikipedia = http://www.wikipedia.com/wiki/%s
wikantik.interWikiRef.Google = http://www.google.com/search?q=%s
wikantik.interWikiRef.Doc = http://wiki.wikantik.com/Wiki.jsp?page=%s
wikantik.interWikiRef.JIRA = https://issues.apache.org/jira/browse/JSPWIKI-%s
mail.from = Wikantik <Wikantik@localhost>
mail.smtp.host = 127.0.0.1
mail.smtp.port = 25
wikantik.use.external.logconfig = false
status = warn
name = wikantik-log4j2-tests-configuration
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %highlight{[%-5level]} %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1.} - %msg%n %ex
rootLogger.level = debug
rootLogger.appenderRef.stdout.ref = STDOUT
