# Wikantik OpenAPI tool server (/tools/*) - defaults. Override by placing a file with the
# same name on the parent classloader (e.g. tomcat/lib/wikantik-tools.properties).

# [Tools access]
# Access control - a request passes if it matches EITHER a DB-minted API key (scope=tools or
# scope=all, minted via the admin UI at /admin/apikeys) OR a source IP within one of these
# comma-separated CIDR blocks.
# Type: list
# Blank means: no CIDR allowlist; only API keys (or tools.access.allowUnrestricted) grant access.
tools.access.allowedCidrs =

# *** SECURITY ***
# When neither a DB-minted API key nor tools.access.allowedCidrs grants a request, the filter
# fails closed: every tool request is rejected with HTTP 503 and a CRITICAL line is logged at
# startup. Setting this to true disables both checks (for a trusted local deployment) and treats
# every caller as authorized. The integration test suite sets this to true; production
# deployments must leave it false.
# Type: boolean
tools.access.allowUnrestricted = false

# [Tools limits]
# Global rate limit, requests per second, across all /tools/* callers combined.
# ToolsRateLimiter treats <= 0 as "disabled" for this limit.
# Type: int
tools.ratelimit.global = 100

# Per-client rate limit, requests per second (client = resolved caller identity).
# ToolsRateLimiter treats <= 0 as "disabled" for this limit.
# Type: int
tools.ratelimit.perClient = 10

# Public base URL used to build absolute citation links in tool responses. This is the
# /tools server's own copy of wikantik.public.baseURL (declared and described in
# ini/wikantik.properties); ToolsConfig.publicBaseUrl() reads it from THIS file, not that
# one. Leave unset to fall back to the request scheme/host (correct in direct deployments);
# set explicitly when behind a reverse proxy that rewrites host headers.
# Example: wikantik.public.baseURL = https://wiki.example.com
