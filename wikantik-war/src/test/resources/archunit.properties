# ArchUnit configuration for wikantik-war architecture tests.
# KnowledgeGraphFenceArchTest is frozen: its violation store under the path below is the
# Knowledge Graph deletion burn-down list (entries only ever come out).
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
